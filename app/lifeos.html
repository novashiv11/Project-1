<title>LifeOS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: one column "field notebook" — capture bar on top, tabs, then a single list of item rows with a left date gutter. */
:root{
  --bg:#eef2ee; --card:#fbfcfa; --fg:#18211c; --muted:#5c6a62; --line:#d5ddd6;
  --accent:#0d6b58; --accent-ink:#f4fbf8; --warn:#a85b00; --warn-bg:#fbeedd; --late:#b3261e; --late-bg:#fbe4e1;
  --chip:#e2e9e3;
  --display:"Bricolage Grotesque",ui-rounded,system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121815; --card:#1a221e; --fg:#e7eee9; --muted:#97a69d; --line:#2c3832;
  --accent:#5fd0b2; --accent-ink:#0b1713; --warn:#f0b061; --warn-bg:#3a2a14; --late:#ff8a80; --late-bg:#3d1c1a;
  --chip:#24302a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121815; --card:#1a221e; --fg:#e7eee9; --muted:#97a69d; --line:#2c3832;
  --accent:#5fd0b2; --accent-ink:#0b1713; --warn:#f0b061; --warn-bg:#3a2a14; --late:#ff8a80; --late-bg:#3d1c1a;
  --chip:#24302a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.5 var(--body)}
.wrap{max-width:680px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font:800 28px/1 var(--display);letter-spacing:-.02em;margin:0;text-wrap:balance}
h1 small{font:500 12px var(--mono);color:var(--muted);letter-spacing:.04em;margin-left:8px}
.store-note{font-size:13px;color:var(--muted)}
form.cap{display:flex;gap:8px}
#q{flex:1;min-width:0;padding:14px 16px;font:16px var(--body);color:var(--fg);background:var(--card);border:1.5px solid var(--line);border-radius:14px}
#q:focus{outline:none;border-color:var(--accent)}
button{font:700 15px var(--body);cursor:pointer;border-radius:12px;border:0}
button:focus-visible,#q:focus-visible,.tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.go{background:var(--accent);color:var(--accent-ink);padding:0 20px}
.hint{font-size:13px;color:var(--muted);margin:-8px 0 0}
.hint code{font:500 12px var(--mono);background:var(--chip);padding:1px 5px;border-radius:5px}
.tabs{display:flex;gap:4px;background:var(--chip);padding:4px;border-radius:14px;overflow-x:auto}
.tab{flex:1;padding:9px 10px;background:transparent;color:var(--muted);white-space:nowrap}
.tab[aria-selected="true"]{background:var(--card);color:var(--fg);box-shadow:0 1px 2px rgb(0 0 0 / .08)}
section{display:grid;gap:10px}
h2{font:600 13px var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:8px 0 0}
.list{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.row{display:grid;grid-template-columns:76px 1fr auto;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.when{font:500 12px/1.3 var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.when b{display:block;font-weight:500;color:var(--fg)}
.when.soon b{color:var(--warn)} .when.late b{color:var(--late)}
.what{min-width:0;overflow-wrap:anywhere}
.what .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.chip{font:500 11px var(--mono);letter-spacing:.03em;padding:2px 7px;border-radius:999px;background:var(--chip);color:var(--muted)}
.areas{display:grid;gap:8px}
.area-btn{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:center;text-align:left;width:100%;padding:12px 14px;background:var(--card);border:1px solid var(--line);color:var(--fg);font:400 15px var(--body)}
.area-btn:hover{border-color:var(--accent)}
.area-btn .ic{font-size:22px;line-height:1}
.area-btn .nm{font-weight:700;display:block}
.area-btn .sub{color:var(--muted);font-size:13px;display:block;min-width:0;overflow-wrap:anywhere}
.area-btn .n{font:500 13px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.back{background:transparent;color:var(--accent);padding:4px 0;justify-self:start}
.covers{color:var(--muted);margin:0}
.tipline{background:var(--chip);border-radius:12px;padding:10px 14px;font-size:14px}
.row.done .what{color:var(--muted);text-decoration:line-through}
.act{display:flex;gap:6px}
.tick{width:38px;height:38px;border:1.5px solid var(--line);background:transparent;color:var(--accent);font-size:18px;line-height:1}
.tick:hover{border-color:var(--accent);background:var(--chip)}
.del{background:transparent;color:var(--muted);font-size:13px;padding:6px 8px}
.empty{padding:18px 16px;color:var(--muted)}
.examples{display:flex;flex-wrap:wrap;gap:8px;padding:0 16px 16px}
.ex{background:var(--chip);color:var(--fg);font:400 14px var(--body);padding:8px 12px;border-radius:999px}
.answer{background:var(--card);border:1.5px solid var(--accent);border-radius:16px;padding:14px 16px;display:grid;gap:4px}
.answer .label{font:600 12px var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--accent)}
.answer .main{font:600 18px/1.35 var(--display);overflow-wrap:anywhere}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0}
.stat .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.stat .v{font:800 26px/1.2 var(--display);font-variant-numeric:tabular-nums}
.stat .s{font:500 12px var(--mono);color:var(--muted);overflow-wrap:anywhere}
.prompt{background:var(--card);border:1px dashed var(--accent);border-radius:16px;padding:14px 16px;font:600 18px/1.4 var(--display)}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{background:var(--chip);color:var(--muted);font:500 13px var(--body);padding:6px 10px;border-radius:999px}
.filters button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 12px 10px 16px;border-radius:14px;display:flex;gap:12px;align-items:center;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgb(0 0 0 / .2)}
.toast span{min-width:0;overflow-wrap:anywhere}
.toast button{background:transparent;color:var(--bg);text-decoration:underline;padding:4px}
@media (max-width:420px){.row{grid-template-columns:64px 1fr auto;gap:10px;padding:12px}}
.mic{background:var(--chip);color:var(--fg);padding:0 14px;font-size:18px}
.mic.on{background:var(--late-bg);color:var(--late)}
.brief{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px;display:grid;gap:8px}
.brief .hello{font:800 24px/1.15 var(--display);letter-spacing:-.01em;text-wrap:balance}
.brief ul{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.brief li{display:flex;gap:10px;align-items:baseline}
.brief li b{font:500 12px var(--mono);color:var(--accent);min-width:84px;white-space:nowrap}
.gbtn{background:var(--chip);color:var(--accent);font:700 12px var(--body);padding:3px 9px;border-radius:999px}
.guide{padding:4px 14px 14px 102px;display:grid;gap:8px;border-top:1px dashed var(--line)}
.guide h3{font:700 15px var(--body);margin:8px 0 0}
.guide ol{margin:0;padding-left:20px;display:grid;gap:4px}
.guide .links{display:flex;gap:8px;flex-wrap:wrap}
.guide a{background:var(--accent);color:var(--accent-ink);text-decoration:none;font:700 14px var(--body);padding:8px 12px;border-radius:10px}
@media (max-width:420px){.guide{padding-left:14px}}
.chat{display:grid;gap:10px}
.scan{background:var(--card);border:1.5px solid var(--accent);border-radius:16px;padding:14px 16px;display:grid;gap:10px}
.scan .top{display:flex;gap:12px;align-items:center}
.scan img{width:56px;height:56px;object-fit:contain;border-radius:10px;background:#fff;flex:none}
.scan .nm{font:700 17px/1.3 var(--display);overflow-wrap:anywhere}
.nutri{display:grid;grid-template-columns:repeat(auto-fit,minmax(70px,1fr));gap:6px}
.nutri div{background:var(--chip);border-radius:10px;padding:6px 8px;font:500 12px var(--mono);color:var(--muted)}
.nutri b{display:block;font:700 15px var(--body);color:var(--fg)}
.ns{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:8px;font:800 16px var(--display);color:#fff;flex:none}
.ns-a{background:#038141}.ns-b{background:#85bb2f}.ns-c{background:#e6a100}.ns-d{background:#ee8100}.ns-e{background:#e63e11}.ns-x{background:var(--muted)}
.scan .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grams{display:flex;gap:6px;align-items:center}
.grams input{width:80px;padding:8px 10px;font:16px var(--mono);color:var(--fg);background:var(--bg);border:1.5px solid var(--line);border-radius:10px}
.food{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:grid;gap:8px}
.food .big{font:800 26px/1 var(--display);font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:99px;background:var(--chip);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar i.over{background:var(--warn)}
.setup select{padding:10px;font:16px var(--body);color:var(--fg);background:var(--card);border:1.5px solid var(--line);border-radius:12px}
.msg{max-width:88%;padding:10px 14px;border-radius:16px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.me{justify-self:end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.msg.bot{justify-self:start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.img{justify-self:end;max-width:60%;padding:0;overflow:hidden}
.msg.img img{display:block;width:100%}
.msg.act{justify-self:start;background:transparent;color:var(--muted);font:500 12px var(--mono);padding:0 4px}
.chatform{display:flex;gap:8px}
.chatform input,.setup input{flex:1;min-width:0;padding:12px 14px;font:16px var(--body);color:var(--fg);background:var(--card);border:1.5px solid var(--line);border-radius:12px}
.setup{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:10px}
.setup label{font-size:13px;color:var(--muted);display:grid;gap:4px}
.linkbtn{background:transparent;color:var(--accent);padding:4px 0;font-size:14px}
@media (prefers-reduced-motion:no-preference){.row{transition:background .15s}}
</style>

<div class="wrap">
  <header>
    <h1>LifeOS<small>JARVIS v0.8</small></h1>
    <span class="store-note" id="storeNote">Connecting…</span>
  </header>
  <form class="cap" id="cap" autocomplete="off">
    <input id="q" name="q" placeholder="kal vet 5pm · passport expires 2027-03-14" aria-label="Capture or ask">
    <button class="mic" type="button" id="cambtn" aria-label="Scan a barcode or take a photo">📷</button>
    <input type="file" id="cam" accept="image/*" capture="environment" hidden>
    <input type="file" id="restoreFile" accept="application/json,.json" hidden>
    <button class="mic" type="button" id="mic" hidden aria-label="Speak instead of typing">🎤</button>
    <button class="go" type="submit">Add</button>
  </form>
  <p class="hint">Type anything about any part of life. End with <code>?</code> to ask. Prefix <code>idea:</code>, <code>work:</code>, <code>home:</code> etc. to pick the area. Hindi dates work: <code>kal</code>, <code>parso</code>, <code>shukravar ko</code>.</p>
  <div id="answer" hidden></div>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-v="today" id="tab-today">Today</button>
    <button class="tab" role="tab" data-v="life" id="tab-life">Life</button>
    <button class="tab" role="tab" data-v="review" id="tab-review">Week</button>
    <button class="tab" role="tab" data-v="all" id="tab-all">All</button>
    <button class="tab" role="tab" data-v="jarvis" id="tab-jarvis">Jarvis</button>
  </div>
  <main id="view"></main>
</div>
<div class="toast" id="toast" hidden><span id="toastMsg"></span><button id="toastUndo" type="button">Undo</button></div>

const STOP=new Set("a an the is are was were be been of to for in on at by my our your me i we it its this that what when where which who how do does did any next last ka ki ke kab hai kya mera meri mere".split(" "));
const SYN={vaccine:["vaccination","shot","jab","rabies"],vet:["doctor"],passport:["visa","document"],rent:["landlord"],package:["parcel","delivery","order"]};
function tokens(text){
  const w=new Set((text.toLowerCase().match(/[a-z0-9]+/g)||[]).filter(x=>!STOP.has(x)).map(x=>x.replace(/s+$/,"")));
  for(const [k,s] of Object.entries(SYN)) if(w.has(k)||s.some(x=>w.has(x))){w.add(k);s.forEach(x=>w.add(x))}
  return w;
}
function answer(q,items,today){
  const qt=tokens(q);
  const scored=items.map(it=>{const tt=tokens(it.text);let hit=0;qt.forEach(x=>{if(tt.has(x))hit++});
    const up=!!it.due&&!it.done&&daysLeft(it,today)>=0;return{hit,up,it}}).filter(s=>s.hit);
  scored.sort((a,b)=>b.hit-a.hit||(b.up-a.up)||String(a.it.due||"9999").localeCompare(String(b.it.due||"9999"))||b.it.id-a.it.id);
  return scored.slice(0,3).map(s=>s.it);
}

async function connect(){
  try{
    const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
    const uid=db&&user?await user.id():null;
    if(!uid)throw new Error("no db");
    const col=db.collection(`data/users/${uid}/items`);
    backend={label:"Private to you · synced across devices",
      async put(it){items.set(it.id,it);render();await col.doc("i"+it.id).set(it)},
      async del(id){items.delete(id);render();await col.doc("i"+id).delete()}};
    col.onSnapshot(snap=>{items=new Map(snap.docs.map(d=>{const x=upgrade(d.data());return[x.id,x]}));render()},
      e=>{note(`Sync paused: ${e.message}`)});
  }catch(e){backend=localBackend;backend.load()}
  note(backend.label);render();
}

  return `<div class="brief"><div class="hello">${hi}${name} ${h<17?"☀️":"🌙"}</div>${body}</div>`;
}

function row(it,today,{del=false}={}){
  let when="";
  if(it.due){const n=daysLeft(it,today),d=fromIso(it.due),cls=it.done?"":n<0?"late":n<=2?"soon":"";
    when=`<div class="when ${cls}"><b>${rel(n)}</b>${d.getDate()} ${MON_SHORT[d.getMonth()]}${d.getFullYear()!==today.getFullYear()?" "+d.getFullYear():""}${it.due.includes("T")?" · "+it.due.slice(11):""}</div>`}
  else when=`<div class="when">${esc((it.created||"").slice(5,10).replace("-","/"))}</div>`;
  const a=area(it.domain), chips=[`<span class="chip">${a.icon} ${esc(a.label)}</span>`];
  if(it.repeat)chips.push(`<span class="chip">every ${it.repeat.every>1?it.repeat.every+" "+it.repeat.unit+"s":it.repeat.unit}</span>`);
  (it.tracking||[]).forEach(t=>chips.push(`<span class="chip">${esc(t)}</span>`));
  (it.metrics||[]).forEach(m=>chips.push(`<span class="chip">${esc(m.name)} ${m.value}${esc(m.unit||"")}</span>`));
  const acts=[];
  const g=guideFor(it);
  if(g&&!it.done)chips.push(`<button class="gbtn" data-guide="${it.id}" aria-expanded="${openGuides.has(it.id)}">${openGuides.has(it.id)?"Hide guide":"Guide ›"}</button>`);
  if(!it.done&&!isFood(it))acts.push(`<button class="tick" data-done="${it.id}" aria-label="Mark done: ${esc(it.text)}">✓</button>`);
  if(del)acts.push(`<button class="del" data-del="${it.id}">Delete</button>`);
  const panel=g&&!it.done&&openGuides.has(it.id)?`<div class="guide"><h3>${esc(g.title)}</h3><ol>${g.steps.map(x=>`<li>${esc(x)}</li>`).join("")}</ol>${g.links.length?`<div class="links">${g.links.map(l=>`<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)} ↗</a>`).join("")}</div>`:""}</div>`:"";
  return `<div class="row${it.done?" done":""}">${when}<div class="what">${esc(it.text)}<div class="meta">${chips.join("")}</div></div><div class="act">${acts.join("")}</div></div>${panel}`;
}
const list=(arr,today,empty,o)=>`<div class="list">${arr.length?arr.map(i=>row(i,today,o)).join(""):`<div class="empty">${empty}</div>`}</div>`;
const EXAMPLES=LIFE.start_examples||AREAS.map(a=>a.examples[0]);
const openDated=arr=>arr.filter(i=>i.due&&!i.done).sort((a,b)=>a.due.localeCompare(b.due));

const isFood=i=>/^\s*food\s*:/i.test(i.text)||(i.metrics||[]).some(m=>m.name==="kcal");
function foodCard(all,today){
  const t=iso(today), eaten=all.filter(i=>isFood(i)&&i.created.slice(0,10)===t);
  if(!eaten.length)return "";
  const sum=n=>eaten.reduce((a,i)=>a+((i.metrics||[]).find(m=>m.name===n)||{value:0}).value,0);
  const kcal=Math.round(sum("kcal")), goal=+settings.kcalGoal||0, pct=goal?Math.min(100,kcal/goal*100):0;
  return `<section><h2>Food today</h2><div class="food"><div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px">
    <span class="big">${kcal} <small style="font-size:14px">kcal${goal?` of ${goal}`:""}</small></span><span class="covers">${+sum("protein").toFixed(1)} g protein · ${+sum("sugar_g").toFixed(1)} g sugar</span></div>
    ${goal?`<div class="bar"><i class="${kcal>goal?"over":""}" style="width:${pct}%"></i></div>`:""}
    ${list(eaten.sort((a,b)=>b.id-a.id),today,"",{del:true})}</div></section>`;
}
function vToday(all,today){
  const open=openDated(all);
  const late=open.filter(i=>daysLeft(i,today)<0);
  const up=open.filter(i=>{const n=daysLeft(i,today);return n>=0&&n<=leadDays(i)});
  const notes=all.filter(i=>!i.due&&!i.done&&!isFood(i)).sort((a,b)=>b.id-a.id).slice(0,5);
  if(!all.length)return `<section><h2>Start here</h2><div class="list"><div class="empty">Nothing captured yet. Tap an example to add it, or type your own. Every part of life works: home, money, health, work, family, travel, pets, documents and more.</div><div class="examples">${EXAMPLES.map(e=>`<button class="ex" data-ex="${esc(e)}">${esc(e)}</button>`).join("")}</div></div></section>`;
  return briefCard(all,today)+(late.length?`<section><h2>Overdue</h2>${list(late,today)}</section>`:"")+
    `<section><h2>Coming up</h2>${list(up,today,"Nothing due soon. Renewals show up early: passport 6 months, insurance 1 month.")}</section>`+
    foodCard(all,today)+`<section><h2>Recent notes</h2>${list(notes,today,"Undated notes and ideas land here.")}</section>`;
}

/* metrics */
function points(arr,since){
  const out={};
  [...arr].sort((a,b)=>a.id-b.id).forEach(i=>{const d=i.created.slice(0,10);if(since&&d<since)return;
    (i.metrics||[]).forEach(m=>(out[m.name]=out[m.name]||[]).push([d,m.value]))});
  return out;
}
function statCard(name,s){
  const u=unitOf(name), vals=s.map(x=>x[1]), label=name.replace("me.","my ").replace("pet.","pet ");
  if(isSum(name))return `<div class="stat"><div class="k">${esc(label)}</div><div class="v">${u}${+vals.reduce((a,b)=>a+b,0).toFixed(2)}</div><div class="s">${vals.length} entries</div></div>`;
  const avg=vals.reduce((a,b)=>a+b,0)/vals.length;
  return `<div class="stat"><div class="k">${esc(label)}</div><div class="v">${vals[vals.length-1]}<small style="font-size:14px"> ${esc(u)}</small></div><div class="s">${vals.slice(-5).join(" → ")} · avg ${+avg.toFixed(1)}</div></div>`;
}
const statGrid=pts=>Object.keys(pts).length?`<div class="stats">${Object.entries(pts).map(([n,s])=>statCard(n,s)).join("")}</div>`:"";

/* life wheel + one area */
let lifeArea=null;
function vLife(all,today){
  if(lifeArea)return vArea(all,lifeArea,today);
  const by={}; all.forEach(i=>{const id=area(i.domain).id;(by[id]=by[id]||[]).push(i)});
  const used=[...AREAS,FALLBACK].filter(a=>by[a.id]), quiet=AREAS.filter(a=>!by[a.id]);
  const card=a=>{const its=by[a.id]||[], open=its.filter(i=>!i.done).length, nx=openDated(its)[0];
    const sub=nx?`Next: ${esc(nx.text)} · ${rel(daysLeft(nx,today))}`:esc(a.covers);
    return `<button class="area-btn" data-area="${a.id}"><span class="ic">${a.icon}</span><span><span class="nm">${esc(a.label)}</span><span class="sub">${sub}</span></span><span class="n">${its.length?open+" open":""}</span></button>`};
  return (used.length?`<section><h2>Your areas</h2><div class="areas">${used.map(card).join("")}</div></section>`:"")+
    (quiet.length?`<section><h2>${used.length?"Not tracking yet":"Every part of life"}</h2><div class="areas">${quiet.map(card).join("")}</div></section>`:"");
}
function vArea(all,id,today){
  const a=area(id), its=all.filter(i=>area(i.domain).id===a.id);
  const sched=openDated(its), notes=its.filter(i=>!i.due&&!i.done).sort((x,y)=>y.id-x.id).slice(0,6);
  const hist=its.filter(i=>i.done||(i.completions||[]).length).sort((x,y)=>y.id-x.id).slice(0,6);
  return `<button class="back" data-area="">← All areas</button><section><h2>${a.icon} ${esc(a.label)}</h2><p class="covers">${esc(a.covers)}</p></section>`+
    statGrid(points(its))+
    `<section><h2>Scheduled</h2>${list(sched,today,"Nothing scheduled.")}</section>`+
    `<section><h2>Notes</h2>${list(notes,today,"No notes yet.")}</section>`+
    `<section><h2>Done</h2>${list(hist,today,"Nothing completed yet.")}</section>`+
    `<section><h2>Try typing</h2><div class="examples" style="padding:0">${(a.examples||[]).map(e=>`<button class="ex" data-fill="${esc(e)}">${esc(e)}</button>`).join("")}</div><div class="tipline">${esc(a.tip)}</div></section>`;
}

const PROMPTS=["What gave you energy this week, and what drained it?","One thing you're proud of, one thing you'd redo?","Which part of your life got no attention this week?","What are you avoiding? What's the smallest next step?","Who do you want to spend more time with next week?","What would make next week feel like a win?"];
function vReview(all,today){
  const start=iso(addDays(today,-6)), end=iso(addDays(today,7));
  const week=all.filter(i=>i.created.slice(0,10)>=start);
  const doneN=all.filter(i=>(i.done_at||"").slice(0,10)>=start).length+all.reduce((n,i)=>n+(i.completions||[]).filter(c=>c.slice(0,10)>=start).length,0);
  const ideas=week.filter(i=>i.domain==="idea");
  const next=openDated(all).filter(i=>i.due.slice(0,10)>=iso(today)&&i.due.slice(0,10)<=end);
  const wk=Math.floor((today-new Date(today.getFullYear(),0,1))/6048e5);
  const touched=new Set(week.map(i=>area(i.domain).id));
  const quiet=[...new Set(all.map(i=>area(i.domain).id))].filter(id=>!touched.has(id)).map(id=>area(id));
  return `<div class="stats"><div class="stat"><div class="k">Captured</div><div class="v">${week.length}</div><div class="s">since ${start.slice(5)}</div></div><div class="stat"><div class="k">Completed</div><div class="v">${doneN}</div><div class="s">incl. repeats</div></div></div>`+
    statGrid(points(all,start))+
    (quiet.length?`<section><h2>Quiet this week</h2><div class="tipline">${quiet.map(a=>a.icon+" "+esc(a.label)).join(" · ")}</div></section>`:"")+
    `<section><h2>Journal prompt</h2><div class="prompt">${PROMPTS[wk%PROMPTS.length]}</div><p class="hint" style="margin:0">Answer in the box with <code>journal: …</code></p></section>`+
    `<section><h2>Ideas this week</h2>${list(ideas,today,"No ideas yet. Prefix with idea:")}</section>`+
    `<section><h2>Next 7 days</h2>${list(next,today,"Nothing scheduled.")}</section>`;
}
let filter="", showDone=false;
function vAll(all,today){
  const doms=[...new Set(all.map(i=>area(i.domain).id))].sort();
  const rows=all.filter(i=>(showDone||!i.done)&&(!filter||area(i.domain).id===filter)).sort((a,b)=>b.id-a.id);
  return `<div class="filters"><button data-f="" aria-pressed="${!filter}">All</button>${doms.map(d=>`<button data-f="${d}" aria-pressed="${filter===d}">${area(d).icon} ${esc(area(d).label)}</button>`).join("")}<button data-showdone aria-pressed="${showDone}">Show done</button></div>`+
    list(rows,today,"Nothing here.",{del:true})+prefsPanel();
}
let pendingRestore=null;
function prefsPanel(){
  const lb=settings.lastBackup||"never";
  const restore=pendingRestore?`<div class="scan"><b>Restore ${pendingRestore.items.length} items from ${esc((pendingRestore.exported||"").slice(0,10)||"this backup")}?</b>
    <span class="covers">This replaces the ${items.size} items on this phone.</span>
    <div class="acts"><button class="go" style="padding:10px 14px" data-data="restore-yes">Restore</button><button class="linkbtn" data-data="restore-no">Cancel</button></div></div>`:"";
  return `<section><h2>Your data</h2><div class="setup"><span>Everything lives only on this phone. Back up to keep it safe if the phone is lost or Chrome data is cleared.</span>
    <span class="covers">Last backup: ${esc(lb)}</span>
    <div class="acts" style="display:flex;gap:8px;flex-wrap:wrap"><button class="go" style="padding:10px 14px" data-data="backup">Back up now</button><button class="linkbtn" data-data="restore">Restore from file</button></div></div>${restore}</section>
    <section><h2>Settings</h2><form class="setup" id="prefs">
    <label>Your name<input id="pname" value="${esc(settings.name||"")}" autocomplete="given-name"></label>
    <label>Daily calorie goal (optional)<input id="pgoal" type="number" inputmode="numeric" value="${esc(settings.kcalGoal||"")}" placeholder="e.g. 2200"></label>
    <label>Voice language<select id="plang">${[["en-IN","English (India), good for Hinglish"],["en-IE","English (Ireland)"],["hi-IN","Hindi"]].map(([v,l])=>`<option value="${v}"${(settings.voiceLang||"en-IN")===v?" selected":""}>${l}</option>`).join("")}</select></label>
    <button class="go" type="submit" style="padding:12px">Save settings</button></form>
    <p class="hint" style="margin:8px 0 0"><a href="privacy.html" target="_blank" rel="noopener" style="color:var(--accent)">Privacy: what stays on your phone</a></p></section>`;
}
function backupNow(){
  const data={app:"LifeOS",format:1,exported:new Date().toISOString(),items:[...items.values()],
    settings:{name:settings.name||"",kcalGoal:settings.kcalGoal||"",voiceLang:settings.voiceLang||""}}; // API key is never exported
  const name=`lifeos-backup-${iso(todayDate())}.json`, file=new File([JSON.stringify(data,null,1)],name,{type:"application/json"});
  const done=()=>{settings.lastBackup=iso(todayDate());saveSettings();render();toast("Backup saved",false)};
  if(navigator.canShare&&navigator.canShare({files:[file]}))
    navigator.share({files:[file],title:"LifeOS backup"}).then(done).catch(e=>{if(e.name!=="AbortError")download()});
  else download();
  function download(){const a=document.createElement("a");a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),5000);done()}
}
async function applyRestore(){
  const r=pendingRestore; pendingRestore=null; if(!r)return;
  for(const id of [...items.keys()])if(!r.items.some(i=>i.id===id))await backend.del(id);
  for(const it of r.items)await backend.put(upgrade(it));
  if(r.settings){Object.assign(settings,Object.fromEntries(Object.entries(r.settings).filter(([,v])=>v)));saveSettings()}
  undoStack=[]; render(); toast(`Restored ${r.items.length} items`,false);
}

/* ---------- Jarvis: chat with Claude using the user's own key (phone app only) ---------- */
const MODEL="claude-haiku-5-5";
const SYSTEM=`You are Jarvis, the assistant inside LifeOS, a private life-admin app. The user lives in Ireland and may write in English or Hinglish; reply in the same style, briefly (at most 4 short sentences unless asked for detail).
Each user message starts with today's date and a snapshot of their LifeOS items (id | area | due | text). Answer questions from that snapshot.
When the user tells you something to remember, a task, a date or a plan, call add_item with one short line in their words, including the date in plain words (e.g. "IRP card expires 2027-01-20", "dentist kal 4pm", "rent every month"). Call add_item once per separate thing.
When the user says they finished something on the list, call complete_item with its id.
For Irish admin (IRP/immigration, NCT, motor tax, Revenue, RTB, PPSN) give general guidance and point to the official site (irishimmigration.ie, ncts.ie, motortax.ie, revenue.ie, rtb.ie, citizensinformation.ie). If you are not sure of a fee, deadline or rule, say so and point to the official site instead of guessing.
Never ask for passport, IRP, PPSN or bank numbers. When the user sends a photo of a card, letter or bill, save only what they must act on (expiry/renewal dates, amounts due and due dates) and never copy document, card or account numbers into items or replies.`;
const TOOLS=[
 {name:"add_item",description:"Save a new note, task, reminder or dated item to the user's LifeOS.",strict:true,
  input_schema:{type:"object",properties:{text:{type:"string",description:"One short line, with any date in plain words"}},required:["text"],additionalProperties:false}},
 {name:"complete_item",description:"Mark an existing item done by its id. Recurring items move to their next date.",strict:true,
  input_schema:{type:"object",properties:{id:{type:"integer"}},required:["id"],additionalProperties:false}}];
let chatMsgs=[], chatLog=[], chatBusy=false;
const CHAT_OK=!window.claude; // inside claude.ai the page can't reach the API; the phone app can
function snapshot(today){
  const rows=[...items.values()].filter(i=>!i.done).sort((a,b)=>(a.due||"9999").localeCompare(b.due||"9999")).slice(0,150)
    .map(i=>`${i.id} | ${area(i.domain).label} | ${i.due||"-"} | ${i.text}`);
  return `Today: ${iso(today)}\nMy LifeOS items:\n${rows.join("\n")||"(none yet)"}`;
}
async function callClaude(){
  const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"content-type":"application/json","x-api-key":settings.key,
    "anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
    body:JSON.stringify({model:MODEL,max_tokens:2048,system:SYSTEM,tools:TOOLS,messages:chatMsgs,output_config:{effort:"low"},cache_control:{type:"ephemeral"}})});
  const data=await r.json().catch(()=>({}));
  if(!r.ok){const m=data.error&&data.error.message||r.statusText;throw new Error(r.status===401?"That API key didn't work. Check it in Jarvis settings.":r.status===429?"Too many requests right now. Try again in a minute.":m)}
  return data;
}
async function runTool(b){
  if(b.name==="add_item"&&typeof b.input.text==="string"&&b.input.text.trim()){
    const id=Math.max(0,...items.keys())+1, it={id,created:nowStamp(),done:false,...parse(b.input.text.trim(),todayDate())};
    await backend.put(it); chatLog.push({who:"act",text:`✓ saved to ${area(it.domain).label}${it.due?` · ${it.due}`:""}: ${it.text}`});
    return `Saved as #${id} in ${area(it.domain).label}${it.due?`, due ${it.due}`:""}.`;
  }
  if(b.name==="complete_item"&&items.has(b.input.id)){
    const before=items.get(b.input.id).text; await complete(b.input.id); chatLog.push({who:"act",text:`✓ done: ${before}`});
    const after=items.get(b.input.id); return after&&!after.done?`Done; next due ${after.due}.`:"Marked done.";
  }
  return {error:"Invalid input or unknown item."};
}
async function askJarvis(text,image){
  if(chatBusy)return;
  if(chatMsgs.length>40){chatMsgs=[];chatLog.push({who:"act",text:"(started a fresh chat)"})}
  chatBusy=true; if(image)chatLog.push({who:"img",src:image.url}); chatLog.push({who:"me",text}); render();
  const content=[{type:"text",text:snapshot(todayDate())}];
  if(image)content.push({type:"image",source:{type:"base64",media_type:"image/jpeg",data:image.b64}});
  content.push({type:"text",text});
  chatMsgs.push({role:"user",content});
  try{
    for(let step=0;step<5;step++){
      const res=await callClaude();
      chatMsgs.push({role:"assistant",content:res.content}); // append unchanged (thinking blocks included)
      if(res.stop_reason==="refusal"){chatLog.push({who:"bot",text:"I can't help with that one."});break}
      const said=res.content.filter(c=>c.type==="text").map(c=>c.text).join("\n").trim();
      if(said)chatLog.push({who:"bot",text:said});
      const calls=res.content.filter(c=>c.type==="tool_use");
      if(res.stop_reason!=="tool_use"||!calls.length)break;
      const results=[];
      for(const c of calls){const out=await runTool(c);
        results.push(typeof out==="string"?{type:"tool_result",tool_use_id:c.id,content:out}:{type:"tool_result",tool_use_id:c.id,content:out.error,is_error:true})}
      chatMsgs.push({role:"user",content:results});
    }
  }catch(e){chatMsgs.pop();chatLog.push({who:"act",text:navigator.onLine===false?"You're offline. Jarvis needs internet; everything else works offline.":`⚠ ${e.message}`})}
  chatBusy=false; render();
}
function vJarvis(){
  if(!CHAT_OK)return `<div class="setup"><b>Jarvis chat works in the phone app.</b><span class="covers">Open LifeOS on your phone to chat.</span></div>`;
  if(!settings.key||settings.editing)return `<form class="setup" id="setup"><b>Set up Jarvis</b>
    <label>Your name<input id="sname" value="${esc(settings.name||"")}" autocomplete="given-name"></label>
    <label>Claude API key<input id="skey" type="password" value="${esc(settings.key||"")}" placeholder="sk-ant-…" autocomplete="off"></label>
    <span class="covers">The key is saved only on this phone and sent only to Anthropic. A few cents a month for normal use. Get one at console.anthropic.com.</span>
    <button class="go" type="submit" style="padding:12px">Save</button></form>`;
  const bubbles=chatLog.length?chatLog.map(m=>m.who==="img"?`<div class="msg img"><img src="${m.src}" alt="Photo you sent"></div>`:`<div class="msg ${m.who}">${esc(m.text)}</div>`).join(""):
    `<div class="msg bot">Hi${settings.name?" "+esc(settings.name):""}! Tell me anything to remember, or ask: "IRP renewal kab start karun?"</div>`;
  return `<div class="chat">${bubbles}${chatBusy?`<div class="msg act">Jarvis is thinking…</div>`:""}
    <form class="chatform" id="chatform" autocomplete="off"><input id="cq" placeholder="Message Jarvis" aria-label="Message Jarvis"><button class="go" type="submit">Send</button></form>
    <div style="display:flex;gap:16px"><button class="linkbtn" data-chat="new">New chat</button><button class="linkbtn" data-chat="settings">Settings</button></div></div>`;
}

/* ---------- camera: barcode → Open Food Facts, QR → text/link, other photos → Jarvis ---------- */
let scanned=null;
async function shrink(file,max=1568){ // downscale before decoding/sending: fewer tokens, faster
  const bmp=await createImageBitmap(file), k=Math.min(1,max/Math.max(bmp.width,bmp.height));
  const c=document.createElement("canvas"); c.width=Math.round(bmp.width*k); c.height=Math.round(bmp.height*k);
  c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
  const url=c.toDataURL("image/jpeg",0.85); return {bmp,url,b64:url.split(",")[1]};
}
async function readCodes(bmp){
  if(!("BarcodeDetector" in window))return [];
  try{const formats=await BarcodeDetector.getSupportedFormats();return await new BarcodeDetector({formats}).detect(bmp)}catch(e){return []}
}
const n1=v=>v==null||v===""?"–":(+v).toFixed(+v<10?1:0);
async function lookupFood(code){
  const r=await fetch(`https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(code)}.json?fields=product_name,brands,quantity,nutriscore_grade,nutriments,image_front_small_url,serving_quantity`);
  const d=await r.json(); if(d.status!==1||!d.product)return null;
  const p=d.product, n=p.nutriments||{};
  return {kind:"food",code,name:[p.product_name,p.brands].filter(Boolean).join(" · ")||`Product ${code}`,qty:p.quantity||"",grade:(p.nutriscore_grade||"").toLowerCase(),
    img:p.image_front_small_url||"",serving:+p.serving_quantity||0,kcal:n["energy-kcal_100g"],sugar:n.sugars_100g,fat:n.fat_100g,sat:n["saturated-fat_100g"],protein:n.proteins_100g,salt:n.salt_100g};
}
function scanCard(){
  const x=scanned; if(!x)return "";
  if(x.kind==="food"){
    const g=["a","b","c","d","e"].includes(x.grade)?x.grade:"x";
    return `<div class="scan"><div class="top">${x.img?`<img src="${esc(x.img)}" alt="">`:""}<div style="flex:1;min-width:0"><div class="nm">${esc(x.name)}</div><span class="covers">${esc(x.qty)} · per 100 g</span></div><span class="ns ns-${g}" title="Nutri-Score">${g==="x"?"?":g.toUpperCase()}</span></div>
      <div class="nutri"><div><b>${n1(x.kcal)}</b>kcal</div><div><b>${n1(x.sugar)}g</b>sugar</div><div><b>${n1(x.fat)}g</b>fat</div><div><b>${n1(x.sat)}g</b>sat fat</div><div><b>${n1(x.protein)}g</b>protein</div><div><b>${n1(x.salt)}g</b>salt</div></div>
      <div class="acts"><label class="grams">I ate <input id="fgrams" type="number" inputmode="decimal" min="1" value="${x.serving||100}" aria-label="grams eaten"> g</label>
      <button class="go" style="padding:10px 14px" data-scan="food">Add to food log</button><button class="linkbtn" data-scan="close">Close</button></div>
      <span class="covers">Data: Open Food Facts</span></div>`;
  }
  const isUrl=/^https?:\/\//i.test(x.text);
  return `<div class="scan"><b>${x.kind==="qr"?"QR code":"Barcode"}</b><div style="overflow-wrap:anywhere">${isUrl?`<a href="${esc(x.text)}" target="_blank" rel="noopener">${esc(x.text)} ↗</a>`:esc(x.text)}</div>
    <div class="acts"><button class="go" style="padding:10px 14px" data-scan="save">Save as note</button><button class="linkbtn" data-scan="close">Close</button></div></div>`;
}
function showScan(){const box=document.getElementById("answer");box.innerHTML=scanCard();box.hidden=!scanned}
async function onPhoto(file){
  if(!file)return;
  toast("Reading photo…",false);
  let img; try{img=await shrink(file)}catch(e){toast("Couldn't open that photo.",false);return}
  const codes=await readCodes(img.bmp);
  const prod=codes.find(c=>/ean|upc/.test(c.format)), other=codes[0];
  if(prod){
    try{const f=await lookupFood(prod.rawValue);
      scanned=f||{kind:"code",text:prod.rawValue}; if(!f)toast("Product not in Open Food Facts yet.",false); else document.getElementById("toast").hidden=true}
    catch(e){scanned={kind:"code",text:prod.rawValue};toast("No internet: saved the barcode only.",false)}
    showScan(); return;
  }
  if(other){scanned={kind:other.format==="qr_code"?"qr":"code",text:other.rawValue};document.getElementById("toast").hidden=true;showScan();return}
  if(CHAT_OK&&settings.key){document.getElementById("toast").hidden=true;view="jarvis";render();
    askJarvis("What's in this photo? Save anything I need to act on (expiry or renewal dates, bills and due dates). Don't copy any ID or account numbers.",img);return}
  toast(("BarcodeDetector" in window)?"No barcode found. Set up Jarvis (Jarvis tab) to read photos.":"Scanning needs Chrome on Android. Set up Jarvis to read photos.",false);
}
document.getElementById("cambtn").addEventListener("click",()=>document.getElementById("cam").click());
document.getElementById("cam").addEventListener("change",e=>{onPhoto(e.target.files[0]);e.target.value=""});
document.getElementById("restoreFile").addEventListener("change",async e=>{
  const f=e.target.files[0]; e.target.value=""; if(!f)return;
  try{const d=JSON.parse(await f.text());
    if(d.app!=="LifeOS"||!Array.isArray(d.items)||!d.items.every(i=>Number.isInteger(i.id)&&typeof i.text==="string"))throw 0;
    pendingRestore=d; view="all"; render()}
  catch(_){toast("That file isn't a LifeOS backup.",false)}
});

let view="today";
try{view=localStorage.getItem("lifeos.view")||"today";if(view==="dog")view="life"}catch(e){}
function render(){
  const all=[...items.values()], today=todayDate();
  document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected",t.dataset.v===view));
  const cq=document.getElementById("cq"), draft=cq?cq.value:"", focused=document.activeElement===cq;
  document.getElementById("view").innerHTML=({today:vToday,life:vLife,review:vReview,all:vAll,jarvis:vJarvis}[view]||vToday)(all,today);
  const cq2=document.getElementById("cq"); if(cq2){cq2.value=draft;if(focused)cq2.focus()}
}
let toastTimer;
function toast(msg,canUndo=true){
  const el=document.getElementById("toast");document.getElementById("toastMsg").textContent=msg;
  document.getElementById("toastUndo").hidden=!canUndo;el.hidden=false;
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.hidden=true,5000);
}
function showAnswer(q){
  const today=todayDate(), best=answer(q,[...items.values()],today), box=document.getElementById("answer");
  if(!best.length)box.innerHTML=`<div class="answer"><span class="label">Answer</span><div class="main">Nothing in your journal matches that yet.</div></div>`;
  else{const t=best[0];box.innerHTML=`<div class="answer"><span class="label">Answer</span><div class="main">${esc(t.text)}${t.due?` · ${rel(daysLeft(t,today))}`:""}</div>${t.due?`<div class="when">${esc(t.due.replace("T"," "))}</div>`:""}</div>`+(best.length>1?`<section><h2>Related</h2>${list(best.slice(1),today)}</section>`:"")}
  box.hidden=false;
}

document.getElementById("cap").addEventListener("submit",async e=>{
  e.preventDefault(); const inp=document.getElementById("q"), text=inp.value.trim(); if(!text||!backend)return;
  inp.value="";
  if(text.endsWith("?")&&!/^\w+\s*:/.test(text)){
    if(CHAT_OK&&settings.key){view="jarvis";document.getElementById("answer").hidden=true;askJarvis(text)}else showAnswer(text)}
  else{document.getElementById("answer").hidden=true;await capture(text)}
});
document.addEventListener("click",async e=>{
  const b=e.target.closest("button"); if(!b)return;
  if(b.dataset.v){view=b.dataset.v;lifeArea=null;try{localStorage.setItem("lifeos.view",view)}catch(_){}render();return}
  if(b.dataset.area!==undefined){lifeArea=b.dataset.area||null;render();window.scrollTo(0,0);return}
  if(b.dataset.fill){const q=document.getElementById("q");q.value=b.dataset.fill;q.focus();return}
  if(b.dataset.guide){const id=+b.dataset.guide;openGuides.has(id)?openGuides.delete(id):openGuides.add(id);render();return}
  if(b.dataset.chat==="new"){chatMsgs=[];chatLog=[];render();return}
  if(b.dataset.data==="backup"){backupNow();return}
  if(b.dataset.data==="restore"){document.getElementById("restoreFile").click();return}
  if(b.dataset.data==="restore-no"){pendingRestore=null;render();return}
  if(b.dataset.data==="restore-yes"&&backend){await applyRestore();return}
  if(b.dataset.scan){const x=scanned, gIn=document.getElementById("fgrams"), grams=gIn?+gIn.value:0; scanned=null; showScan();
    if(b.dataset.scan==="food"&&x&&backend){
      const g=Math.max(1,grams||100), k=g/100, part=(v,u)=>v==null?"":` · ${+(v*k).toFixed(1)} ${u}`;
      await capture(`food: ${x.name} (${g} g)${x.kcal!=null?` · ${Math.round(x.kcal*k)} kcal`:""}${part(x.protein,"g protein")}${part(x.sugar,"g sugar")} · Nutri-Score ${x.grade?x.grade.toUpperCase():"?"}`)}
    if(b.dataset.scan==="save"&&x&&backend)await capture(`${x.kind==="qr"?"QR":"barcode"}: ${x.text}`);
    return}
  if(b.dataset.chat==="settings"){settings.editing=true;render();return}
  if(!backend)return;
  if(false){}
  else if(b.dataset.done)await complete(+b.dataset.done);
  else if(b.dataset.del)await change(+b.dataset.del,null,"Deleted");
  else if(b.dataset.ex)await capture(b.dataset.ex);
  else if(b.dataset.f!==undefined){filter=b.dataset.f;render()}
  else if(b.hasAttribute("data-showdone")){showDone=!showDone;render()}
  else if(b.id==="toastUndo"){document.getElementById("toast").hidden=true;await undo()}
});
document.addEventListener("submit",e=>{
  if(e.target.id==="setup"){e.preventDefault();settings.name=document.getElementById("sname").value.trim();
    settings.key=document.getElementById("skey").value.trim();delete settings.editing;saveSettings();render()}
  if(e.target.id==="prefs"){e.preventDefault();settings.name=document.getElementById("pname").value.trim();
    settings.kcalGoal=document.getElementById("pgoal").value.trim();settings.voiceLang=document.getElementById("plang").value;saveSettings();render();toast("Settings saved",false)}
  if(e.target.id==="chatform"){e.preventDefault();const i=document.getElementById("cq"),t=i.value.trim();if(t&&backend){i.value="";askJarvis(t)}}
});
(()=>{ // voice capture (Chrome on Android/desktop)
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition, mic=document.getElementById("mic");
  if(!SR)return; mic.hidden=false; let rec=null;
  mic.addEventListener("click",()=>{
    if(rec){rec.stop();return}
    rec=new SR(); rec.lang=settings.voiceLang||"en-IN"; rec.interimResults=true;
    const q=document.getElementById("q"); mic.classList.add("on");
    rec.onresult=ev=>{const r=ev.results[ev.results.length-1];q.value=[...ev.results].map(x=>x[0].transcript).join(" ");
      if(r.isFinal)document.getElementById("cap").requestSubmit()};
    rec.onerror=ev=>{if(ev.error==="not-allowed"||ev.error==="service-not-allowed")toast("Microphone is blocked. Allow it for LifeOS in phone settings.",false)};
    rec.onend=()=>{rec=null;mic.classList.remove("on")};
    rec.start();
  });
})();
render();
if(window.claude&&claude.use)connect();else{backend=localBackend;backend.load();note(backend.label);render()}
</script>
