<title>LifeOS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: "Jarvis home" — greeting hero, now-cards, stat tiles; a Jarvis input dock and a bottom nav fixed to the screen. Dark-first. */
:root{
  --bg:#0b0f0d; --card:#141b17; --card2:#1a231e; --fg:#e9f1ec; --muted:#8aa196; --line:#1f2a24;
  --accent:#5fd0b2; --accent-ink:#0b0f0d; --warn:#f0b061; --warn-bg:#3a2a14; --late:#ff8a80; --late-bg:#3d1c1a; --ok-bg:#16302a;
  --chip:#1c2621; --nav:#0e1411; --shadow:0 10px 30px rgb(0 0 0 / .45); color-scheme:dark;
  --display:"Bricolage Grotesque",ui-rounded,system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --navh:0px; --dockh:60px;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#f3f6f3; --card:#ffffff; --card2:#ffffff; --fg:#16201a; --muted:#5f6e65; --line:#e1e7e0;
  --accent:#0d6b58; --accent-ink:#f4fbf8; --warn:#a35a00; --warn-bg:#fbeedd; --late:#b3261e; --late-bg:#fbe4e1; --ok-bg:#dcefe7;
  --chip:#ebf0ea; --nav:#ffffff; --shadow:0 10px 30px rgb(20 40 30 / .14); color-scheme:light}}
:root[data-theme="light"]{
  --bg:#f3f6f3; --card:#ffffff; --card2:#ffffff; --fg:#16201a; --muted:#5f6e65; --line:#e1e7e0;
  --accent:#0d6b58; --accent-ink:#f4fbf8; --warn:#a35a00; --warn-bg:#fbeedd; --late:#b3261e; --late-bg:#fbe4e1; --ok-bg:#dcefe7;
  --chip:#ebf0ea; --nav:#ffffff; --shadow:0 10px 30px rgb(20 40 30 / .14); color-scheme:light}
*{box-sizing:border-box}
html,body{background:var(--bg)}
html{scroll-padding-bottom:calc(var(--navh) + var(--dockh) + 40px + env(safe-area-inset-bottom,0px));scroll-padding-top:16px}
body{color:var(--fg);font:16px/1.5 var(--body);-webkit-tap-highlight-color:transparent}
.wrap{max-width:640px;margin:0 auto;padding-block:16px calc(var(--navh) + var(--dockh) + 40px + env(safe-area-inset-bottom,0px));
  padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
body[data-view="jarvis"] .wrap{padding-bottom:calc(var(--navh) + var(--dockh) + 40px + env(safe-area-inset-bottom,0px))}
button{font:700 15px var(--body);cursor:pointer;border-radius:14px;border:0;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:6px}
.date{font:500 12px var(--mono);color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.store-note{display:block;font:400 12px var(--body);color:var(--muted);letter-spacing:0;text-transform:none;margin-top:2px}
.av{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#7ee0c6,#2c7b66);color:#0b0f0d;font:800 16px var(--display);flex:none}
#banners{display:flex;gap:8px;flex-wrap:wrap}
#banners:empty{display:none}
#banners button{background:var(--chip);color:var(--fg);font:700 14px var(--body);padding:10px 14px;border-radius:99px}
.go{background:var(--accent);color:var(--accent-ink);padding:0 18px}
section{display:grid;gap:10px}
h2{font:500 12px var(--mono);text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:6px 0 0}
.covers{color:var(--muted);margin:0}
/* hero */
.brief{display:grid;gap:10px}
.hello{font:800 clamp(30px,9vw,40px)/1.04 var(--display);letter-spacing:-.025em;text-wrap:balance}
.sub{color:var(--muted);font-size:16px}.sub b{color:var(--accent)}
.lines{display:flex;flex-wrap:wrap;gap:6px}
.lines span{font:500 12px var(--mono);background:var(--chip);color:var(--muted);padding:5px 10px;border-radius:99px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lines span b{color:var(--accent);font-weight:500;margin-right:6px}
/* now cards */
.cards{display:grid;gap:10px}
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:14px;display:grid;grid-template-columns:46px minmax(0,1fr) auto;gap:12px;align-items:center;touch-action:pan-y}
.ic{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;font-size:22px;background:color-mix(in srgb,var(--c,#5fd0b2) 22%,transparent)}
.card .t{font:700 16px/1.3 var(--display);overflow-wrap:anywhere}
.card .m{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;margin-top:2px}
.side{display:grid;justify-items:end;gap:8px}
.pill{font:500 11px var(--mono);padding:5px 9px;border-radius:99px;background:var(--ok-bg);color:var(--accent);white-space:nowrap}
.pill.late{background:var(--late-bg);color:var(--late)}.pill.soon{background:var(--warn-bg);color:var(--warn)}
.tick{width:36px;height:36px;border-radius:12px;background:var(--chip);color:var(--accent);font-size:17px;line-height:1}
.gbtn{background:none;color:var(--accent);font:700 13px var(--body);padding:0}
.card.leaving{transform:translateX(110%);opacity:0;transition:transform .28s ease-in,opacity .28s ease-in}
.card.snoozing{transform:translateX(-110%);opacity:0;transition:transform .28s ease-in,opacity .28s ease-in}
.guide{background:var(--card);border:1px solid var(--line);border-top:0;border-radius:0 0 22px 22px;margin-top:-22px;padding:26px 16px 16px;display:grid;gap:8px}
.guide h3{font:700 15px var(--body);margin:0}
.guide ol{margin:0;padding-left:20px;display:grid;gap:4px;color:var(--fg)}
.guide .links{display:flex;gap:8px;flex-wrap:wrap}
.guide a{background:var(--accent);color:var(--accent-ink);text-decoration:none;font:700 14px var(--body);padding:9px 13px;border-radius:12px}
.swipehint{font:500 11px var(--mono);color:var(--muted);text-align:center;letter-spacing:.04em}
/* stat tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.favs{display:flex;flex-wrap:wrap;gap:8px}
.fav{min-width:0;max-width:100%;padding:10px 12px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--fg);font:14px var(--body);text-align:left}
.fav b{font:600 12px var(--mono);color:var(--muted)}
.kweek{position:relative;box-sizing:border-box;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;height:160px;padding:22px 0 0;align-items:end}
.kday{display:grid;grid-template-rows:1fr auto;height:100%;text-align:center;gap:4px;min-width:0}
.kday small{font:11px var(--mono);color:var(--muted)}
.kbar{align-self:end;position:relative;min-height:2px;border-radius:8px 8px 3px 3px;background:var(--accent);opacity:.55}
.kbar.now{opacity:1}.kbar.over{background:#e5484d}
.kbar span{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font:10px var(--mono);color:var(--muted);padding-bottom:2px;white-space:nowrap}
.kgoal{position:absolute;left:0;right:0;border-top:1.5px dashed var(--muted);pointer-events:none;opacity:.6;z-index:1}
.tile{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:14px;display:grid;gap:2px;text-align:left;min-width:0}
.tile .k{font:500 11px var(--mono);color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.tile .big{font:800 28px/1.1 var(--display);font-variant-numeric:tabular-nums}
.tile .s{font-size:13px;color:var(--muted)}
.bar{height:6px;border-radius:99px;background:var(--chip);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}.bar i.over{background:var(--warn)}
/* plain lists (notes, all, week) */
.list{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.row{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.when{font:500 11px/1.3 var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.when b{display:block;font-weight:500;color:var(--fg)}
.when.soon b{color:var(--warn)}.when.late b{color:var(--late)}
.what{min-width:0;overflow-wrap:anywhere}
.what .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;align-items:center}
.chip{font:500 11px var(--mono);letter-spacing:.02em;padding:2px 8px;border-radius:99px;background:var(--chip);color:var(--muted)}
.row.done .what{color:var(--muted);text-decoration:line-through}
.act{display:flex;gap:6px;align-items:center}
.del{background:transparent;color:var(--muted);font-size:13px;padding:6px 4px}
.empty{padding:18px 16px;color:var(--muted)}
.examples{display:flex;flex-wrap:wrap;gap:8px}
.ex{background:var(--chip);color:var(--fg);font:400 14px var(--body);padding:9px 13px;border-radius:99px}
.answer{background:var(--card);border:1.5px solid var(--accent);border-radius:20px;padding:14px 16px;display:grid;gap:4px}
.answer .label{font:500 11px var(--mono);text-transform:uppercase;letter-spacing:.1em;color:var(--accent)}
.answer .main{font:700 18px/1.35 var(--display);overflow-wrap:anywhere}
/* life wheel */
.wheel{display:flex;gap:18px;align-items:center}
.wheel svg{flex:none}
.legend{display:grid;gap:6px;font-size:14px;min-width:0}
.legend span{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:8px;background:var(--c)}
.strip{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin:0 calc(-1*max(18px,env(safe-area-inset-left,0px)));padding:0 max(18px,env(safe-area-inset-left,0px))}
.strip::-webkit-scrollbar{display:none}
.acard{flex:none;width:136px;border-radius:20px;padding:14px;text-align:left;background:color-mix(in srgb,var(--c) 20%,var(--card));color:var(--fg);display:grid;gap:2px}
.acard b{font:700 15px var(--display);margin-top:6px}.acard small{font-size:12px;color:var(--muted)}
.qchips{display:flex;flex-wrap:wrap;gap:8px}
.qchips button{background:var(--chip);color:var(--muted);font:400 13px var(--body);padding:7px 12px;border-radius:99px}
.back{background:transparent;color:var(--accent);padding:4px 0;justify-self:start}
.tipline{background:var(--chip);border-radius:14px;padding:10px 14px;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:12px 14px;min-width:0}
.stat .k{font:500 11px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.stat .v{font:800 26px/1.2 var(--display);font-variant-numeric:tabular-nums}
.stat .s{font:500 12px var(--mono);color:var(--muted);overflow-wrap:anywhere}
.prompt{background:var(--card);border:1px dashed var(--accent);border-radius:20px;padding:14px 16px;font:700 18px/1.4 var(--display)}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{background:var(--chip);color:var(--muted);font:500 13px var(--body);padding:7px 11px;border-radius:99px}
.filters button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
/* scan + forms */
.scan{background:var(--card);border:1.5px solid var(--accent);border-radius:20px;padding:14px 16px;display:grid;gap:10px}
.scan .top{display:flex;gap:12px;align-items:center}
.scan img{width:56px;height:56px;object-fit:contain;border-radius:12px;background:#fff;flex:none}
.scan .nm{font:700 17px/1.3 var(--display);overflow-wrap:anywhere}
.scan a{color:var(--accent)}
.nutri{display:grid;grid-template-columns:repeat(auto-fit,minmax(70px,1fr));gap:6px}
.nutri div{background:var(--chip);border-radius:12px;padding:6px 8px;font:500 12px var(--mono);color:var(--muted)}
.nutri b{display:block;font:700 15px var(--body);color:var(--fg)}
.ns{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:9px;font:800 16px var(--display);color:#fff;flex:none}
.ns-a{background:#038141}.ns-b{background:#85bb2f}.ns-c{background:#e6a100}.ns-d{background:#ee8100}.ns-e{background:#e63e11}.ns-x{background:#7f9488}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grams{display:flex;gap:6px;align-items:center}
.grams input{width:80px;padding:9px 10px;font:16px var(--mono);color:var(--fg);background:var(--bg);border:1.5px solid var(--line);border-radius:12px}
.setup{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;display:grid;gap:10px}
.setup label{font-size:13px;color:var(--muted);display:grid;gap:4px}
.setup input,.setup select{min-width:0;padding:12px 14px;font:16px var(--body);color:var(--fg);background:var(--bg);border:1.5px solid var(--line);border-radius:14px}
.linkbtn{background:transparent;color:var(--accent);padding:6px 0;font-size:14px}
.setup textarea{min-width:0;padding:12px 14px;font:14px/1.4 var(--mono);color:var(--fg);background:var(--bg);border:1.5px solid var(--line);border-radius:14px;resize:vertical}
.pv{display:grid;gap:6px}.pv div{background:var(--chip);border-radius:12px;padding:8px 12px;font-size:14px;overflow-wrap:anywhere}
/* jarvis */
.jhead{display:flex;gap:12px;align-items:center}
.orb{width:42px;height:42px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#a8f0dc,#2c9b7f 55%,#0f3d32);box-shadow:0 0 22px rgb(95 208 178 / .45);flex:none}
.orb.busy{animation:pulse 1.2s ease-in-out infinite}
.jhead b{font:700 18px var(--display);display:block}.jhead small{color:var(--accent);font-size:12px}
.chat{display:grid;gap:10px}
.msg{max-width:86%;padding:11px 14px;border-radius:20px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.me{justify-self:end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:6px}
.msg.bot{justify-self:start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:6px}
.msg.img{justify-self:end;max-width:60%;padding:0;overflow:hidden}
.msg.img img{display:block;width:100%}
.msg.act{justify-self:start;background:transparent;color:var(--muted);font:500 12px var(--mono);padding:0 4px}
/* dock + nav (fixed) */
.dock{position:fixed;z-index:5;left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));
  bottom:calc(var(--navh) + 10px + env(safe-area-inset-bottom,0px));max-width:620px;margin:0 auto;height:var(--dockh);
  background:var(--card2);border:1px solid var(--line);border-radius:24px;padding:8px 8px 8px 16px;display:flex;gap:8px;align-items:center;box-shadow:var(--shadow)}
.dock input{flex:1;min-width:0;background:transparent;border:0;color:var(--fg);font:16px var(--body);padding:8px 0}
.dock input::placeholder{color:var(--muted)}
.dock input:focus{outline:none}
.db{width:44px;height:44px;border-radius:16px;background:var(--chip);display:grid;place-items:center;font-size:18px;flex:none;padding:0}
.db.on{background:var(--late-bg);color:var(--late);animation:pulse 1s ease-in-out infinite}
.db.go{background:var(--accent);color:var(--accent-ink);font:800 20px var(--body)}
body[data-view="jarvis"] #cap{display:none}
nav.tabs{position:fixed;z-index:6;left:0;right:0;bottom:0;height:calc(var(--navh) + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);
  background:var(--nav);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);align-items:center}
.tab{background:none;color:var(--muted);font:500 11px var(--mono);letter-spacing:.04em;display:grid;justify-items:center;gap:3px;padding:6px 0;border-radius:0}
.tab i{font-style:normal;font-size:20px;line-height:1}
.tab[aria-selected="true"]{color:var(--accent)}
.tab.jv i{width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#a8f0dc,#2c9b7f 55%,#0f3d32);display:block;margin-top:-6px;box-shadow:0 0 14px rgb(95 208 178 / .35)}
.toast{position:fixed;z-index:7;left:50%;transform:translateX(-50%);bottom:calc(var(--navh) + var(--dockh) + 22px + env(safe-area-inset-bottom,0px));
  background:var(--fg);color:var(--bg);padding:10px 12px 10px 16px;border-radius:16px;display:flex;gap:12px;align-items:center;max-width:calc(100% - 32px);box-shadow:var(--shadow);font-weight:700}
.toast span{min-width:0;overflow-wrap:anywhere}
.toast button{background:transparent;color:var(--bg);text-decoration:underline;padding:4px}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pulse{50%{transform:scale(1.06);opacity:.85}}
@media (prefers-reduced-motion:no-preference){#view>*{animation:rise .28s ease-out both}#view>*:nth-child(2){animation-delay:.04s}#view>*:nth-child(3){animation-delay:.08s}#view>*:nth-child(4){animation-delay:.12s}}
@media (prefers-reduced-motion:reduce){.card.leaving,.card.snoozing{transition:none}.orb.busy,.db.on{animation:none}}
#view{display:grid;gap:18px;grid-template-columns:minmax(0,1fr)}
/* simple home */
h1#title{font:800 34px/1.05 var(--display);letter-spacing:-.02em;margin:2px 0 4px}
header .date{display:flex;gap:4px;flex-wrap:wrap}
.more{width:44px;height:44px;border-radius:50%;background:var(--chip);color:var(--fg);font:800 22px/1 var(--body);flex:none}
.capbox{display:flex;gap:8px;align-items:center;background:var(--card2);border:1px solid var(--line);border-radius:20px;padding:8px 8px 8px 16px}
.capbox input{flex:1;min-width:0;background:transparent;border:0;color:var(--fg);font:17px var(--body);padding:8px 0}
.capbox input::placeholder{color:var(--muted)}.capbox input:focus{outline:none}
body:not([data-view="today"]):not([data-view="orb"]) #cap{display:none}
.grp{display:grid;gap:2px}
.grp h2{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 4px}
.grp h2 span{color:var(--accent);letter-spacing:0}
.srow{display:flex;align-items:center;gap:14px;padding:11px 2px;touch-action:pan-y;border-radius:14px}
.circle{width:28px;height:28px;border-radius:50%;border:2px solid var(--muted);background:none;flex:none;padding:0}
.circle:hover{border-color:var(--accent)}
.st{flex:1;min-width:0;overflow-wrap:anywhere;font-size:17px}
.st small{display:block;font-size:13px;color:var(--muted)}
.st .gbtn{font-size:13px}
.sd{font-size:14px;color:var(--muted);white-space:nowrap;text-align:right}
.sd.hot{color:var(--late)}.sd.warm{color:var(--warn)}
.srow.leaving{transform:translateX(110%);opacity:0;transition:transform .28s ease-in,opacity .28s ease-in}
.srow.snoozing{transform:translateX(-110%);opacity:0;transition:transform .28s ease-in,opacity .28s ease-in}
.srow+.guide{margin-top:0;border-top:1px solid var(--line);border-radius:18px}
.laterhint{background:none;color:var(--muted);font:400 15px var(--body);text-align:left;padding:4px 2px;width:100%}
.allclear{color:var(--muted);padding:6px 2px}
.sheet{position:fixed;inset:0;z-index:8;background:rgb(0 0 0 / .5);display:flex;align-items:flex-end}
.sheet .panel{width:100%;max-width:640px;margin:0 auto;background:var(--card2);border-radius:24px 24px 0 0;padding:14px 14px calc(18px + env(safe-area-inset-bottom,0px));display:grid;gap:6px}
.sheet button{display:flex;gap:14px;align-items:center;text-align:left;background:none;padding:12px;border-radius:16px}
.sheet button:hover{background:var(--chip)}
.sheet i{font-style:normal;font-size:22px;width:40px;height:40px;display:grid;place-items:center;background:var(--chip);border-radius:12px;flex:none}
.sheet b{display:block;font:700 16px var(--display)}.sheet small{color:var(--muted);font-size:13px}
section,.brief,.cards,.chat,.setup,.scan,.answer,.guide{grid-template-columns:minmax(0,1fr)}
</style>

<div class="wrap">
  <header>
    <div style="min-width:0"><button class="back" id="tab-today" data-v="home" hidden>← Home</button>
      <h1 id="title">Aaj</h1><div class="date"><span id="today"></span><span id="storeNote" hidden>Connecting…</span></div></div>
    <button class="more" id="more" aria-label="More: Jarvis, food, life, week, settings" aria-expanded="false">⋯</button>
  </header>
  <div id="banners"></div>

  if(m=text.match(/\b(daily|weekly|monthly|yearly|annually)\b/i))return{every:1,unit:{daily:"day",weekly:"week",monthly:"month",yearly:"year",annually:"year"}[m[1].toLowerCase()]};
  if(new RegExp(`\\bevery\\s+(${WEEKDAYS.join("|")})\\b`,"i").test(text))return{every:1,unit:"week"};
  return null;
}
function parseMetrics(text){
  const out=[];
  for(const [m,rx] of METRICS){const hit=text.match(rx);if(!hit)continue;
    let name=m.name; if(m.per_subject)name=(isPet(text)&&!/\b(my|meri|mera)\b/i.test(text)?"pet.":"me.")+name;
    out.push({name,value:parseFloat(hit[1].replace(/,/g,"")),unit:m.unit})}
  return out;
}
function addInterval(d,every,unit){
  if(unit==="day"||unit==="week")return addDays(d,every*(unit==="week"?7:1));
  const months=every*(unit==="year"?12:1), y=d.getFullYear(), m=d.getMonth()+months;
  const last=new Date(y,m+1,0).getDate();
  return new Date(y,m,Math.min(d.getDate(),last));
}
function parse(text,today){
  let due=parseDate(text,today); let repeat=parseRepeat(text);
  if(due&&!repeat&&/\b(birthday|bday|anniversary)\b/i.test(text))repeat={every:1,unit:"year"};
  if(repeat&&!due&&repeat.unit==="month"){const m=text.match(/\b(\d{1,2})(?:st|nd|rd|th)\b/i); // "every month on the 5th"
    if(m&&+m[1]>=1&&+m[1]<=28){const day=+m[1];due=day>=today.getDate()?new Date(today.getFullYear(),today.getMonth(),day):new Date(today.getFullYear(),today.getMonth()+1,day)}}
  if(repeat&&!due)due=today;
  let dueStr=null; if(due){const tm=parseTime(text);dueStr=iso(due)+(tm?"T"+tm:"")}
  const tracking=[...text.matchAll(/\b(1Z[0-9A-Z]{16}|[A-Z]{2}\d{9}[A-Z]{2}|\d{12,22})\b/g)].map(m=>m[1]);
  let domain=classify(text);
  if(tracking.length&&domain==="journal")domain="shopping";
  const explicit=/^\s*(?:idea|journal)\s*:/i.test(text);
  if(due&&(domain==="journal"||domain==="idea")&&!explicit&&!/\bidea\b/i.test(text))domain="calendar";
  return{text:text.trim(),domain,due:dueStr,tags:[...text.matchAll(/(?<!\w)#(\w+)/g)].map(m=>m[1]),tracking,repeat,metrics:parseMetrics(text)};
}

/* ---------- ask (port of lifeos/ask.py) ---------- */
const STOP=new Set("a an the is are was were be been of to for in on at by my our your me i we it its this that what when where which who how do does did any next last ka ki ke kab hai kya mera meri mere".split(" "));
const SYN={vaccine:["vaccination","shot","jab","rabies"],vet:["doctor"],passport:["visa","document"],rent:["landlord"],package:["parcel","delivery","order"]};
function tokens(text){
  const w=new Set((text.toLowerCase().match(/[a-z0-9]+/g)||[]).filter(x=>!STOP.has(x)).map(x=>x.replace(/s+$/,"")));
  for(const [k,s] of Object.entries(SYN)) if(w.has(k)||s.some(x=>w.has(x))){w.add(k);s.forEach(x=>w.add(x))}
  return w;
}
function answer(q,items,today){
  const qt=tokens(q);
  const scored=items.map(it=>{const tt=tokens(it.text);let hit=0;qt.forEach(x=>{if(tt.has(x))hit++});
    const up=!!it.due&&!it.done&&daysLeft(it,today)>=0;return{hit,up,it}}).filter(s=>s.hit);
  scored.sort((a,b)=>b.hit-a.hit||(b.up-a.up)||String(a.it.due||"9999").localeCompare(String(b.it.due||"9999"))||b.it.id-a.it.id);
  return scored.slice(0,3).map(s=>s.it);
}

let items=new Map(), backend=null, undoStack=[];
const LS_KEY="lifeos.items.v1";
const localBackend={
  label:"Saved on this device only",
  load(){try{const raw=localStorage.getItem(LS_KEY);(raw?JSON.parse(raw):[]).forEach(i=>items.set(i.id,upgrade(i)))}catch(e){}},
  save(){try{localStorage.setItem(LS_KEY,JSON.stringify([...items.values()]))}catch(e){}},
  async put(it){items.set(it.id,it);this.save();render()},
  async del(id){items.delete(id);this.save();render()}
};
async function connect(){
  try{
    const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
    const uid=db&&user?await user.id():null;
    if(!uid)throw new Error("no db");
    const col=db.collection(`data/users/${uid}/items`);
    backend={label:"Private to you · synced across devices",
      async put(it){items.set(it.id,it);render();await col.doc("i"+it.id).set(it)},
      async del(id){items.delete(id);render();await col.doc("i"+id).delete()}};
    col.onSnapshot(snap=>{items=new Map(snap.docs.map(d=>{const x=upgrade(d.data());return[x.id,x]}));render()},
      e=>{note(`Sync paused: ${e.message}`)});
  }catch(e){backend=localBackend;backend.load()}
  note(backend.label);render();
}

const nowStamp=()=>new Date().toISOString().slice(0,19);

async function change(id,next,msg){

async function undo(){
  const u=undoStack.pop(); if(!u)return;

}

async function complete(id){
  const it=clone(items.get(id)); const today=todayDate();
  if(it.repeat&&it.due){
    const [d,t]=it.due.split("T"); let nx=addInterval(fromIso(d),it.repeat.every,it.repeat.unit);
    while(nx<today)nx=addInterval(nx,it.repeat.every,it.repeat.unit);

function briefLines(all,today){
  const open=openDated(all), out=[];
  const late=open.filter(i=>daysLeft(i,today)<0), now=open.filter(i=>daysLeft(i,today)===0);
  if(late.length)out.push(["overdue",`${late.length} overdue: ${late.slice(0,2).map(i=>i.text).join(", ")}`]);
  if(now.length)out.push(["today",now.slice(0,3).map(i=>i.text).join(", ")]);
  // long-notice items (renewals): say when the action window opens
  open.filter(i=>leadDays(i)>14).forEach(i=>{const n=daysLeft(i,today),opens=n-leadDays(i);
    if(opens>0&&opens<=14)out.push([`in ${opens}d`,`Window opens for: ${i.text}. Get documents ready.`]);
    else if(opens<=0&&opens>-30&&n>0)out.push(["start now",`${i.text} (${n} days left)`]);});

  return out.slice(0,5);
}

/* calendar: .ics for all dated items (mirrors lifeos/ics.py) + one-tap Google Calendar link per item */
const FREQ={day:"DAILY",week:"WEEKLY",month:"MONTHLY",year:"YEARLY"};
const icsEsc=t=>String(t).replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\n/g,"\\n");
function icsTimes(due){
  const ymd=d=>iso(d).replace(/-/g,"");
  if(due.includes("T")){const d=fromIso(due),[h,m]=due.slice(11,16).split(":").map(Number),e=new Date(d.getFullYear(),d.getMonth(),d.getDate(),h+1,m);
    const hm=(x,y)=>`T${pad(x)}${pad(y)}00`;return [ymd(d)+hm(h,m),ymd(e)+hm(e.getHours(),e.getMinutes()),true]}
  const d=fromIso(due);return [ymd(d),ymd(addDays(d,1)),false];
}
function toIcs(list){
  const st=new Date(), stamp=`${iso(st).replace(/-/g,"")}T${pad(st.getHours())}${pad(st.getMinutes())}${pad(st.getSeconds())}`;
  const out=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//LifeOS//EN","CALSCALE:GREGORIAN"];
  for(const it of list){if(!it.due||it.done)continue;const [a,b,timed]=icsTimes(it.due);
    out.push("BEGIN:VEVENT",`UID:lifeos-${it.id}@local`,`DTSTAMP:${stamp}`,`SUMMARY:${icsEsc(it.text)}`,`CATEGORIES:${it.domain.toUpperCase()}`,
      timed?`DTSTART:${a}`:`DTSTART;VALUE=DATE:${a}`,timed?`DTEND:${b}`:`DTEND;VALUE=DATE:${b}`);
    if(it.repeat)out.push(`RRULE:FREQ=${FREQ[it.repeat.unit]};INTERVAL=${it.repeat.every}`);
    const n=Math.min(leadDays(it),30); if(n>7)out.push("BEGIN:VALARM","ACTION:DISPLAY",`DESCRIPTION:${icsEsc(it.text)}`,`TRIGGER:-P${n}D`,"END:VALARM");
    out.push("END:VEVENT")}
  out.push("END:VCALENDAR"); return out.join("\r\n")+"\r\n";
}
function gcalUrl(it){
  const [a,b]=icsTimes(it.due), q=new URLSearchParams({action:"TEMPLATE",text:it.text,dates:`${a}/${b}`,details:"From LifeOS"});
  if(it.repeat)q.set("recur",`RRULE:FREQ=${FREQ[it.repeat.unit]};INTERVAL=${it.repeat.every}`);
  return "https://calendar.google.com/calendar/render?"+q;
}
function shareFile(file,title,done){
  if(navigator.canShare&&navigator.canShare({files:[file]}))
    navigator.share({files:[file],title}).then(done).catch(e=>{if(e.name!=="AbortError")download()});
  else download();
  function download(){const a=document.createElement("a");a.href=URL.createObjectURL(file);a.download=file.name;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),5000);done()}
}
function exportIcs(){
  const n=[...items.values()].filter(i=>i.due&&!i.done).length;
  if(!n){toast("Koi dated item nahi hai",false);return}
  shareFile(new File([toIcs([...items.values()])],`lifeos-${iso(todayDate())}.ics`,{type:"text/calendar"}),"LifeOS calendar",()=>toast(`${n} dates exported 📅`,false));
}
function backupNow(){

async function applyRestore(){

  for(const id of [...items.keys()])if(!r.items.some(i=>i.id===id))await backend.del(id);

/* ---------- Jarvis: chat with Claude using the user's own key (phone app only) ---------- */
const MODEL="claude-haiku-5-5";
const SYSTEM=`You are Jarvis, the assistant inside LifeOS, a private life-admin app. The user lives in Ireland and may write in English or Hinglish; reply in the same style, briefly (at most 4 short sentences unless asked for detail).
Each user message starts with today's date and a snapshot of their LifeOS items (id | area | due | text). Answer questions from that snapshot.
When the user tells you something to remember, a task, a date or a plan, call add_item with one short line in their words, including the date in plain words (e.g. "IRP card expires 2027-01-20", "dentist kal 4pm", "rent every month"). Call add_item once per separate thing.
When the user says they finished something on the list, call complete_item with its id.
For Irish admin (IRP/immigration, NCT, motor tax, Revenue, RTB, PPSN) give general guidance and point to the official site (irishimmigration.ie, ncts.ie, motortax.ie, revenue.ie, rtb.ie, citizensinformation.ie). If you are not sure of a fee, deadline or rule, say so and point to the official site instead of guessing.
Never ask for passport, IRP, PPSN or bank numbers. When the user sends a photo of a card, letter or bill, save only what they must act on (expiry/renewal dates, amounts due and due dates) and never copy document, card or account numbers into items or replies.`;
const TOOLS=[
 {name:"add_item",description:"Save a new note, task, reminder or dated item to the user's LifeOS.",strict:true,
  input_schema:{type:"object",properties:{text:{type:"string",description:"One short line, with any date in plain words"}},required:["text"],additionalProperties:false}},
 {name:"complete_item",description:"Mark an existing item done by its id. Recurring items move to their next date.",strict:true,
  input_schema:{type:"object",properties:{id:{type:"integer"}},required:["id"],additionalProperties:false}}];
let chatMsgs=[], chatLog=[], chatBusy=false;
const CHAT_OK=!window.claude; // inside claude.ai the page can't reach the API; the phone app can
function snapshot(today){
  const rows=[...items.values()].filter(i=>!i.done).sort((a,b)=>(a.due||"9999").localeCompare(b.due||"9999")).slice(0,150)
    .map(i=>`${i.id} | ${area(i.domain).label} | ${i.due||"-"} | ${i.text}`);
  return `Today: ${iso(today)}\nMy LifeOS items:\n${rows.join("\n")||"(none yet)"}`;
}
async function callClaude(){
  const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"content-type":"application/json","x-api-key":settings.key,
    "anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
    body:JSON.stringify({model:MODEL,max_tokens:2048,system:SYSTEM,tools:TOOLS,messages:chatMsgs,output_config:{effort:"low"},cache_control:{type:"ephemeral"}})});
  const data=await r.json().catch(()=>({}));
  if(!r.ok){const m=data.error&&data.error.message||r.statusText;throw new Error(r.status===401?"That API key didn't work. Check it in Jarvis settings.":r.status===429?"Too many requests right now. Try again in a minute.":m)}
  return data;
}
async function runTool(b){
  if(b.name==="add_item"&&typeof b.input.text==="string"&&b.input.text.trim()){
    const id=Math.max(0,...items.keys())+1, it={id,created:nowStamp(),done:false,...parse(b.input.text.trim(),todayDate())};
    await backend.put(it); chatLog.push({who:"act",text:`✓ saved to ${area(it.domain).label}${it.due?` · ${it.due}`:""}: ${it.text}`});
    return `Saved as #${id} in ${area(it.domain).label}${it.due?`, due ${it.due}`:""}.`;
  }
  if(b.name==="complete_item"&&items.has(b.input.id)){
    const before=items.get(b.input.id).text; await complete(b.input.id); chatLog.push({who:"act",text:`✓ done: ${before}`});
    const after=items.get(b.input.id); return after&&!after.done?`Done; next due ${after.due}.`:"Marked done.";
  }
  return {error:"Invalid input or unknown item."};
}
async function askJarvis(text,image){
  if(chatBusy)return;
  if(chatMsgs.length>40){chatMsgs=[];chatLog.push({who:"act",text:"(started a fresh chat)"})}
  chatBusy=true; if(image)chatLog.push({who:"img",src:image.url}); chatLog.push({who:"me",text}); render();
  const content=[{type:"text",text:snapshot(todayDate())}];
  if(image)content.push({type:"image",source:{type:"base64",media_type:"image/jpeg",data:image.b64}});
  content.push({type:"text",text});
  chatMsgs.push({role:"user",content});
  try{
    for(let step=0;step<5;step++){
      const res=await callClaude();
      chatMsgs.push({role:"assistant",content:res.content}); // append unchanged (thinking blocks included)
      if(res.stop_reason==="refusal"){chatLog.push({who:"bot",text:"I can't help with that one."});break}
      const said=res.content.filter(c=>c.type==="text").map(c=>c.text).join("\n").trim();
      if(said)chatLog.push({who:"bot",text:said});
      const calls=res.content.filter(c=>c.type==="tool_use");
      if(res.stop_reason!=="tool_use"||!calls.length)break;
      const results=[];
      for(const c of calls){const out=await runTool(c);
        results.push(typeof out==="string"?{type:"tool_result",tool_use_id:c.id,content:out}:{type:"tool_result",tool_use_id:c.id,content:out.error,is_error:true})}
      chatMsgs.push({role:"user",content:results});
    }
  }catch(e){chatMsgs.pop();chatLog.push({who:"act",text:navigator.onLine===false?"You're offline. Jarvis needs internet; everything else works offline.":`⚠ ${e.message}`})}
  chatBusy=false; render();
}
function vJarvis(){
  if(!CHAT_OK)return `<div class="jhead"><div class="orb"></div><div><b>Jarvis</b><small>phone app only</small></div></div><div class="setup"><b>Jarvis chat works in the phone app.</b><span class="covers">Open LifeOS on your phone to chat.</span></div>`;
  if(!settings.key&&!settings.editing)return vAskClaude();
  if(settings.editing)return `<div class="jhead"><div class="orb"></div><div><b>Jarvis</b><small>optional: automatic chat</small></div></div><form class="setup" id="setup"><b>Claude API key (optional)</b>

    <label>Claude API key<input id="skey" type="password" value="${esc(settings.key||"")}" placeholder="sk-ant-…" autocomplete="off"></label>
    <span class="covers">Without a key, Jarvis uses your Claude app (your subscription, no extra cost). With a key, chat happens right here and saves items itself: a few cents a month, billed by Anthropic. The key stays on this phone.</span>
    <button class="go" type="submit" style="padding:12px">Save</button><button class="linkbtn" type="button" data-chat="nokey">Use my Claude app instead (free)</button></form>`;

function parseClaude(text){
  const at=text.search(/^\s*LIFEOS\s*$/m), body=at>=0?text.slice(at):text, adds=[], dones=[];
  for(const raw of body.split(/\r?\n/)){const l=raw.trim();let m;
    if((m=l.match(/^\+\s*(.{3,200})$/))||(at>=0&&(m=l.match(/^[•*-]\s+(.{3,200})$/))))adds.push(m[1].trim());
    else if(m=l.match(/^done\s*#?(\d+)\b/i))dones.push(+m[1]);}

/* ---------- camera: barcode → Open Food Facts, QR → text/link, other photos → Jarvis ---------- */
let scanned=null;
async function shrink(file,max=1568){ // downscale before decoding/sending: fewer tokens, faster
  const bmp=await createImageBitmap(file), k=Math.min(1,max/Math.max(bmp.width,bmp.height));
  const c=document.createElement("canvas"); c.width=Math.round(bmp.width*k); c.height=Math.round(bmp.height*k);
  c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
  const url=c.toDataURL("image/jpeg",0.85); return {bmp,url,b64:url.split(",")[1]};
}
async function readCodes(bmp){
  if(!("BarcodeDetector" in window))return [];
  try{const formats=await BarcodeDetector.getSupportedFormats();return await new BarcodeDetector({formats}).detect(bmp)}catch(e){return []}
}
const n1=v=>v==null||v===""?"–":(+v).toFixed(+v<10?1:0);
async function lookupFood(code){
  const r=await fetch(`https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(code)}.json?fields=product_name,brands,quantity,nutriscore_grade,nutriments,image_front_small_url,serving_quantity`);
  const d=await r.json(); if(d.status!==1||!d.product)return null;
  const p=d.product, n=p.nutriments||{};
  return {kind:"food",code,name:[p.product_name,p.brands].filter(Boolean).join(" · ")||`Product ${code}`,qty:p.quantity||"",grade:(p.nutriscore_grade||"").toLowerCase(),
    img:p.image_front_small_url||"",serving:+p.serving_quantity||0,kcal:n["energy-kcal_100g"],sugar:n.sugars_100g,fat:n.fat_100g,sat:n["saturated-fat_100g"],protein:n.proteins_100g,salt:n.salt_100g};
}
function scanCard(){
  const x=scanned; if(!x)return "";
  if(x.kind==="food"){
    const g=["a","b","c","d","e"].includes(x.grade)?x.grade:"x";
    return `<div class="scan"><div class="top">${x.img?`<img src="${esc(x.img)}" alt="">`:""}<div style="flex:1;min-width:0"><div class="nm">${esc(x.name)}</div><span class="covers">${esc(x.qty)} · per 100 g</span></div><span class="ns ns-${g}" title="Nutri-Score">${g==="x"?"?":g.toUpperCase()}</span></div>
      <div class="nutri"><div><b>${n1(x.kcal)}</b>kcal</div><div><b>${n1(x.sugar)}g</b>sugar</div><div><b>${n1(x.fat)}g</b>fat</div><div><b>${n1(x.sat)}g</b>sat fat</div><div><b>${n1(x.protein)}g</b>protein</div><div><b>${n1(x.salt)}g</b>salt</div></div>
      <div class="acts"><label class="grams">I ate <input id="fgrams" type="number" inputmode="decimal" min="1" value="${x.serving||100}" aria-label="grams eaten"> g</label>
      <button class="go" style="padding:10px 14px" data-scan="food">Add to food log</button><button class="linkbtn" data-scan="close">Close</button></div>
      <span class="covers">Data: Open Food Facts</span></div>`;
  }
  const isUrl=/^https?:\/\//i.test(x.text);
  return `<div class="scan"><b>${x.kind==="qr"?"QR code":"Barcode"}</b><div style="overflow-wrap:anywhere">${isUrl?`<a href="${esc(x.text)}" target="_blank" rel="noopener">${esc(x.text)} ↗</a>`:esc(x.text)}</div>
    <div class="acts"><button class="go" style="padding:10px 14px" data-scan="save">Save as note</button><button class="linkbtn" data-scan="close">Close</button></div></div>`;
}
function showScan(){const box=document.getElementById("answer");box.innerHTML=scanCard();box.hidden=!scanned}
async function onPhoto(file){
  if(!file)return;
  toast("Reading photo…",false);
  let img; try{img=await shrink(file)}catch(e){toast("Couldn't open that photo.",false);return}
  const codes=await readCodes(img.bmp);
  const prod=codes.find(c=>/ean|upc/.test(c.format)), other=codes[0];
  if(prod){
    try{const f=await lookupFood(prod.rawValue);
      scanned=f||{kind:"code",text:prod.rawValue}; if(!f)toast("Product not in Open Food Facts yet.",false); else document.getElementById("toast").hidden=true}
    catch(e){scanned={kind:"code",text:prod.rawValue};toast("No internet: saved the barcode only.",false)}
    showScan(); return;
  }
  if(other){scanned={kind:other.format==="qr_code"?"qr":"code",text:other.rawValue};document.getElementById("toast").hidden=true;showScan();return}
  if(CHAT_OK&&settings.key){document.getElementById("toast").hidden=true;view="jarvis";render();
    askJarvis("What's in this photo? Save anything I need to act on (expiry or renewal dates, bills and due dates). Don't copy any ID or account numbers.",img);return}
  toast(("BarcodeDetector" in window)?"No barcode found. Set up Jarvis (Jarvis tab) to read photos.":"Scanning needs Chrome on Android. Set up Jarvis to read photos.",false);
}

(()=>{ // swipe a card: right = done, left = snooze one day

    settings.kcalGoal=document.getElementById("pgoal").value.trim();settings.voiceLang=document.getElementById("plang").value;
    settings.myWords=document.getElementById("pwords").value.trim();saveSettings();const n=await remapMine();render();toast(n?`Saved · ${n} item${n>1?"s":""} moved`:"Settings saved",false)}
  if(e.target.id==="askform"){e.preventDefault();const i=document.getElementById("aq"),t=i.value.trim();if(t){i.value="";askClaude(t)}}
  if(e.target.id==="pasteform"){e.preventDefault();pasteResult=parseClaude(document.getElementById("paste").value);render()}
  if(e.target.id==="chatform"){e.preventDefault();const i=document.getElementById("cq"),t=i.value.trim();if(t&&backend){i.value="";askJarvis(t)}}
});
(()=>{ // voice capture (Chrome on Android/desktop)
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition, mic=document.getElementById("mic");
  if(!SR)return; mic.hidden=false; let rec=null;
  mic.addEventListener("click",()=>{
    if(rec){rec.stop();return}
    rec=new SR(); rec.lang=settings.voiceLang||"en-IN"; rec.interimResults=true;
    const q=document.getElementById("q"); mic.classList.add("on");
    rec.onresult=ev=>{const r=ev.results[ev.results.length-1];q.value=[...ev.results].map(x=>x[0].transcript).join(" ");
      if(r.isFinal)document.getElementById("cap").requestSubmit()};
    rec.onerror=ev=>{if(ev.error==="not-allowed"||ev.error==="service-not-allowed")toast("Microphone is blocked. Allow it for LifeOS in phone settings.",false)};
    rec.onend=()=>{rec=null;mic.classList.remove("on")};
    rec.start();
  });
})();
render();
if(window.claude&&claude.use)connect();else{backend=localBackend;backend.load();note(backend.label);render()}
</script>
