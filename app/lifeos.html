<title>LifeOS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: one column "field notebook" — capture bar on top, tabs, then a single list of item rows with a left date gutter. */
:root{
  --bg:#eef2ee; --card:#fbfcfa; --fg:#18211c; --muted:#5c6a62; --line:#d5ddd6;
  --accent:#0d6b58; --accent-ink:#f4fbf8; --warn:#a85b00; --warn-bg:#fbeedd; --late:#b3261e; --late-bg:#fbe4e1;
  --chip:#e2e9e3;
  --display:"Bricolage Grotesque",ui-rounded,system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121815; --card:#1a221e; --fg:#e7eee9; --muted:#97a69d; --line:#2c3832;
  --accent:#5fd0b2; --accent-ink:#0b1713; --warn:#f0b061; --warn-bg:#3a2a14; --late:#ff8a80; --late-bg:#3d1c1a;
  --chip:#24302a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121815; --card:#1a221e; --fg:#e7eee9; --muted:#97a69d; --line:#2c3832;
  --accent:#5fd0b2; --accent-ink:#0b1713; --warn:#f0b061; --warn-bg:#3a2a14; --late:#ff8a80; --late-bg:#3d1c1a;
  --chip:#24302a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.5 var(--body)}
.wrap{max-width:680px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:16px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font:800 28px/1 var(--display);letter-spacing:-.02em;margin:0;text-wrap:balance}
h1 small{font:500 12px var(--mono);color:var(--muted);letter-spacing:.04em;margin-left:8px}
.store-note{font-size:13px;color:var(--muted)}
form.cap{display:flex;gap:8px}
#q{flex:1;min-width:0;padding:14px 16px;font:16px var(--body);color:var(--fg);background:var(--card);border:1.5px solid var(--line);border-radius:14px}
#q:focus{outline:none;border-color:var(--accent)}
button{font:700 15px var(--body);cursor:pointer;border-radius:12px;border:0}
button:focus-visible,#q:focus-visible,.tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.go{background:var(--accent);color:var(--accent-ink);padding:0 20px}
.hint{font-size:13px;color:var(--muted);margin:-8px 0 0}
.hint code{font:500 12px var(--mono);background:var(--chip);padding:1px 5px;border-radius:5px}
.tabs{display:flex;gap:4px;background:var(--chip);padding:4px;border-radius:14px;overflow-x:auto}
.tab{flex:1;padding:9px 10px;background:transparent;color:var(--muted);white-space:nowrap}
.tab[aria-selected="true"]{background:var(--card);color:var(--fg);box-shadow:0 1px 2px rgb(0 0 0 / .08)}
section{display:grid;gap:10px}
h2{font:600 13px var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:8px 0 0}
.list{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.row{display:grid;grid-template-columns:76px 1fr auto;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.when{font:500 12px/1.3 var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.when b{display:block;font-weight:500;color:var(--fg)}
.when.soon b{color:var(--warn)} .when.late b{color:var(--late)}
.what{min-width:0;overflow-wrap:anywhere}
.what .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.chip{font:500 11px var(--mono);letter-spacing:.03em;padding:2px 7px;border-radius:999px;background:var(--chip);color:var(--muted)}
.areas{display:grid;gap:8px}
.area-btn{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:center;text-align:left;width:100%;padding:12px 14px;background:var(--card);border:1px solid var(--line);color:var(--fg);font:400 15px var(--body)}
.area-btn:hover{border-color:var(--accent)}
.area-btn .ic{font-size:22px;line-height:1}
.area-btn .nm{font-weight:700;display:block}
.area-btn .sub{color:var(--muted);font-size:13px;display:block;min-width:0;overflow-wrap:anywhere}
.area-btn .n{font:500 13px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.back{background:transparent;color:var(--accent);padding:4px 0;justify-self:start}
.covers{color:var(--muted);margin:0}
.tipline{background:var(--chip);border-radius:12px;padding:10px 14px;font-size:14px}
.row.done .what{color:var(--muted);text-decoration:line-through}
.act{display:flex;gap:6px}
.tick{width:38px;height:38px;border:1.5px solid var(--line);background:transparent;color:var(--accent);font-size:18px;line-height:1}
.tick:hover{border-color:var(--accent);background:var(--chip)}
.del{background:transparent;color:var(--muted);font-size:13px;padding:6px 8px}
.empty{padding:18px 16px;color:var(--muted)}
.examples{display:flex;flex-wrap:wrap;gap:8px;padding:0 16px 16px}
.ex{background:var(--chip);color:var(--fg);font:400 14px var(--body);padding:8px 12px;border-radius:999px}
.answer{background:var(--card);border:1.5px solid var(--accent);border-radius:16px;padding:14px 16px;display:grid;gap:4px}
.answer .label{font:600 12px var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--accent)}
.answer .main{font:600 18px/1.35 var(--display);overflow-wrap:anywhere}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0}
.stat .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.stat .v{font:800 26px/1.2 var(--display);font-variant-numeric:tabular-nums}
.stat .s{font:500 12px var(--mono);color:var(--muted);overflow-wrap:anywhere}
.prompt{background:var(--card);border:1px dashed var(--accent);border-radius:16px;padding:14px 16px;font:600 18px/1.4 var(--display)}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{background:var(--chip);color:var(--muted);font:500 13px var(--body);padding:6px 10px;border-radius:999px}
.filters button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 12px 10px 16px;border-radius:14px;display:flex;gap:12px;align-items:center;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgb(0 0 0 / .2)}
.toast span{min-width:0;overflow-wrap:anywhere}
.toast button{background:transparent;color:var(--bg);text-decoration:underline;padding:4px}
@media (max-width:420px){.row{grid-template-columns:64px 1fr auto;gap:10px;padding:12px}}
@media (prefers-reduced-motion:no-preference){.row{transition:background .15s}}
</style>

<div class="wrap">
  <header>
    <h1>LifeOS<small>JARVIS v0.5</small></h1>

</div>

<script>
/* ---------- parser (port of lifeos/parse.py) ---------- */
const LIFE=/*LIFE*/{"areas":[{"id":"idea","label":"Ideas","icon":"💡","lead":7,"covers":"Startup and side-project ideas, shower thoughts, things to try","keywords":["idea","what if","app that","startup","side project"],"examples":["idea: chai stall rating app","what if gyms rented by the hour"],"tip":"Ideas resurface in your weekly review so they don't die in notes."},{"id":"pet","label":"Pets","icon":"🐾","lead":7,"covers":"Vet visits, vaccines, deworming, flea/tick meds, food stock, grooming, walks, weight","keywords":["dog","cat","puppy","pup","kitten","pet","vet","walkies","kibble","flea","tick","groom\\w*","leash","deworm\\w*","litter"],"examples":["dog flea meds every 30 days","dog weight 24kg","cat vaccine shukravar ko"],"tip":"Log each dose once with 'every N days' and it rolls forward forever."},{"id":"vehicle","label":"Vehicle","icon":"🚗","lead":7,"covers":"Servicing, NCT, motor tax, insurance renewal, PUC, FASTag/tolls, fuel, tyres, fines","keywords":["car","bike","scooty","scooter","gaadi","vehicle","petrol","diesel","fuel","fastag","puc","challan","tyre\\w*","service center","rc","nct","motor tax","toll","eflow","parking"],"examples":["NCT due 2027-02-10","car insurance expires 2027-02-10","motor tax every 3 months"],"tip":"Add insurance and PUC expiry once; you'll be nudged ahead of time."},{"id":"kids","label":"Kids & school","icon":"🎒","lead":7,"covers":"School fees, PTMs, exams, homework, tuition, vaccinations, activities","keywords":["school","ptm","homework","tuition","kid","kids","son","daughter","beta","beti","baby","diaper\\w*","creche","daycare"],"examples":["school fees due 10 nov","ptm saturday 10am"],"tip":"Term fees can repeat: 'school fees every 3 months'."},{"id":"travel","label":"Travel","icon":"✈️","lead":14,"covers":"Flights, trains, hotels, packing, web check-in, trip plans","keywords":["flight","train","irctc","tatkal","hotel","trip","travel","airport","boarding","check-?in","packing","itinerary","goa","vacation","holiday"],"examples":["flight to goa 20 dec 6am","book tatkal ticket kal"],"tip":"Trips show two weeks ahead so you can book and pack in time."},{"id":"document","label":"Documents & IDs","icon":"🛂","lead":90,"covers":"Passport, visa, IRP/GNIB residence permit, PPSN, licence, insurance policies, certificates, warranties","keywords":["passport","visa","licen[cs]e","aadhaar","aadhar","pan card","voter id","insurance","policy","certificate","id card","expir\\w*","renew\\w*","kyc","irp","gnib","stamp ?[0-9]","ppsn?","residence permit","immigration","embassy","work permit"],"examples":["passport expires 2027-03-14","IRP card expires 2027-01-20","health insurance renew 5 jan","rent agreement expires 2027-08-01"],"tip":"Store only expiry dates, never document numbers. Rent agreements get a 60-day heads-up."},{"id":"family","label":"Family & friends","icon":"👪","lead":7,"covers":"Birthdays, anniversaries, calls home, parents' needs, gifts, catch-ups","keywords":["mom","mum","mummy","maa","dad","papa","parents","wife","husband","bhai","brother","sister","behen","didi","nani","dadi","nana","dada","grandma","grandpa","friend","dost","birthday","bday","anniversary","gift"],"examples":["mom birthday 3 jan","call papa every sunday"],"tip":"Birthdays show a week ahead so there's time for a gift."},{"id":"work","label":"Work & career","icon":"💼","lead":7,"covers":"Meetings, deadlines, interviews, clients, invoices, appraisals, job search","keywords":["meeting","deadline","interview","client","invoice","boss","office","manager","appraisal","resume","cv","job","naukri","project","presentation","standup","freelance"],"examples":["client invoice due friday","interview agle hafte 11am"],"tip":"Freelance? 'invoice X every month' keeps cash flowing."},{"id":"home","label":"Home","icon":"🏠","lead":7,"covers":"Rent, society maintenance, repairs, appliances and servicing, house help, groceries, gas, utility bills","keywords":["house","home","ghar","flat","rent","landlord","tenant","society","maintenance","plumber","electrician","carpenter","repair\\w*","fridge","ac","purifier","geyser","washing machine","wifi","broadband","dth","electricity","bijli","water bill","gas","cylinder","lpg","maid","cook","bai","kaamwali","dhobi","grocer\\w*","kirana","sabzi","doodh","milk","pest control","chore\\w*","warranty","rtb","lease","deposit","bin\\w*","esb","electric ireland","bord gais","eircode"],"examples":["rent every month","ac service every 6 months","gas cylinder book kal"],"tip":"Rent, maintenance and servicing can all repeat: 'ac service every 6 months'."},{"id":"money","label":"Money","icon":"💰","lead":7,"covers":"EMIs, SIPs, credit card dues, taxes/ITR, salary, lending, spending, subscriptions","keywords":["pay","paid","payment","salary","emi","sip","mutual fund","stock\\w*","invest\\w*","spent","kharcha","budget","loan","udhaar","credit card","upi","tax","itr","gst","refund","subscription","netflix","recharge","bank","fd","bill","fees","revenue","usc","prsi","tax credit\\w*","rent credit"],"examples":["credit card bill due 5th every month","spent 450 on dinner","ravi ko 2000 udhaar diya"],"tip":"Type 'spent 450 on X' and the weekly review totals it."},{"id":"health","label":"Health & fitness","icon":"💪","lead":7,"covers":"Doctor and dentist visits, medicines, tests, gym, runs, sleep, steps, water, weight, BP, sugar","keywords":["doctor","dr","dentist","clinic","hospital","medicine\\w*","meds","dawai","dawa","tablet\\w*","checkup","blood test","test report","gym","workout","exercise","run","ran","running","walk(?:ed)?","cycl\\w*","yoga","sleep","slept","neend","steps","water","paani","weight","bp","sugar","diet","protein","period\\w*"],"examples":["dentist in 2 weeks","slept 6h","ran 5km","bp 120/80"],"tip":"Log sleep, steps or runs in plain words; trends show in the weekly review."},{"id":"mind","label":"Mind & mood","icon":"🧠","lead":7,"covers":"Mood, stress, gratitude, therapy, meditation, how you feel","keywords":["mood","feel\\w*","stress\\w*","anxious","anxiety","sad","happy","grateful","gratitude","therapy","therapist","meditat\\w*","overthinking","burnout","lonely"],"examples":["mood 6, thoda stressed","grateful for a calm morning"],"tip":"A daily 'mood N' builds your weekly mood line."},{"id":"growth","label":"Learning & goals","icon":"🌱","lead":7,"covers":"Books, courses, skills, habits, goals, language practice","keywords":["book","read\\w*","course","learn\\w*","study","padhai","skill","goal\\w*","habit\\w*","practice","podcast","certification","exam"],"examples":["read 20 pages daily","goal: learn guitar by march"],"tip":"Habits work best as 'X daily'; mark done each day to keep the streak."},{"id":"shopping","label":"Orders & shopping","icon":"📦","lead":7,"covers":"Deliveries, return windows, refunds, wishlists, things to buy","keywords":["package","parcel","deliver\\w*","courier","shipped","shipment","tracking","order(?:ed)?","amazon","flipkart","myntra","meesho","return","buy","kharidna","wishlist"],"examples":["kal amazon parcel aayega","myntra return by 20 oct"],"tip":"Add the return deadline so you don't miss the window."},{"id":"social","label":"Fun & plans","icon":"🎉","lead":7,"covers":"Movies, parties, weddings, matches, dinners out, hobbies","keywords":["movie","party","wedding","shaadi","concert","match","dinner","lunch","brunch","outing","game","hobby","festival","diwali","holi"],"examples":["shaadi in jaipur 12 dec","movie with ravi saturday 7pm"],"tip":"Plans with friends count toward a balanced week."},{"id":"calendar","label":"Calendar","icon":"📅","lead":7,"covers":"Appointments and events that don't fit elsewhere","keywords":["appointment","event","call","reminder","remind"],"examples":["appointment monday 4pm"],"tip":"Anything with a date lands here if no other area fits."}],"fallback":{"id":"journal","label":"Journal","icon":"📓","lead":7,"covers":"Everything else: thoughts, notes, life log","tip":"Write freely; prefix 'journal:' to force it here."},"lead_overrides":[{"pattern":"passport|visa","days":180,"why":"many countries require 6+ months passport validity to enter"},{"pattern":"irp|gnib|residence permit|work permit","days":84,"why":"Irish permission renewals open 12 weeks before expiry"},{"pattern":"nct","days":30,"why":"NCT slots book up weeks ahead"},{"pattern":"rent agreement|lease","days":60,"why":"time to renegotiate or move"},{"pattern":"insurance|policy|licen[cs]e|warranty|itr|tax","days":30,"why":"renewals and filings take paperwork"},{"pattern":"puc|fastag|exam","days":14,"why":"short validity or prep time"}],"metrics":[{"name":"weight","unit":"kg","pattern":"\\bweight\\s*(?:is\\s*|=\\s*|:\\s*)?(\\d+(?:\\.\\d+)?)\\s*kg\\b","per_subject":true},{"name":"mood","unit":"/10","pattern":"\\bmood\\s*(?:is\\s*|:\\s*)?(\\d{1,2})(?:\\s*/\\s*10)?\\b"},{"name":"sleep","unit":"h","pattern":"\\b(?:slept|sleep|neend)\\s*(?:of\\s*)?(\\d+(?:\\.\\d+)?)\\s*(?:h|hr|hrs|hours?|ghante)\\b"},{"name":"steps","unit":"steps","pattern":"\\b(\\d{3,6})\\s*steps\\b"},{"name":"distance","unit":"km","pattern":"\\b(?:ran|run|walked|walk|cycled)\\s*(\\d+(?:\\.\\d+)?)\\s*(?:km|k)\\b"},{"name":"water","unit":"L","pattern":"\\b(?:water|paani)\\s*(\\d+(?:\\.\\d+)?)\\s*(?:l|litres?|liters?)\\b"},{"name":"spent","unit":"€","pattern":"(?:\\b(?:spent|kharcha|paid)\\s*(?:rs\\.?|inr|eur|₹|€)?\\s*|[₹€]\\s*)(\\d[\\d,]*(?:\\.\\d+)?)","sum":true},{"name":"bp","unit":"mmHg","pattern":"\\bbp\\s*(\\d{2,3})\\s*/\\s*\\d{2,3}\\b"},{"name":"sugar","unit":"mg/dL","pattern":"\\b(?:sugar|glucose)\\s*(\\d{2,3})\\b"}],"start_examples":["IRP card expires 2027-01-20","NCT due 2027-02-10","rent every month","motor tax every 3 months","passport expires 2027-03-14","dentist kal 4pm","mom birthday 3 jan","spent €45 at tesco","idea: side project app","mood 7"]}/*END_LIFE*/;
const AREAS=LIFE.areas, FALLBACK=LIFE.fallback, BY_ID=Object.fromEntries([...AREAS,FALLBACK].map(a=>[a.id,a]));
const LEGACY={dog:"pet",house:"home",package:"shopping"};
const AREA_RE=AREAS.map(a=>[a.id,new RegExp(`\\b(?:${a.keywords.join("|")})\\b`,"i")]);
const OVERRIDES=LIFE.lead_overrides.map(o=>[new RegExp(`\\b(?:${o.pattern})\\b`,"i"),o.days]);
const METRICS=LIFE.metrics.map(m=>[m,new RegExp(m.pattern,"i")]);
const PET_RE=AREA_RE.find(a=>a[0]==="pet")[1];
const area=id=>BY_ID[LEGACY[id]||id]||FALLBACK;
const unitOf=n=>(LIFE.metrics.find(m=>m.name===n.split(".").pop())||{}).unit||"";
const isSum=n=>!!(LIFE.metrics.find(m=>m.name===n.split(".").pop())||{}).sum;
function leadDays(it){const d=OVERRIDES.filter(([rx])=>rx.test(it.text)).map(o=>o[1]);return d.length?Math.max(...d):area(it.domain).lead}
function upgrade(it){it.domain=LEGACY[it.domain]||it.domain;if(!it.metrics){it.metrics=it.metric?[{...it.metric,name:it.metric.name.replace("dog.","pet.")}]:[];delete it.metric}return it}
const WEEKDAYS=["monday","tuesday","wednesday","thursday","friday","saturday","sunday"];
const HI_WEEKDAYS=["som[vw]ar","mangal[vw]ar","budh[vw]ar","guru[vw]ar|brihaspati[vw]ar","shukra[vw]ar","shani[vw]ar","ravi[vw]ar|it[vw]ar"];
const MONTHS=["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"];
const MON="(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*";

const pad=n=>String(n).padStart(2,"0");
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fromIso=s=>{const [y,m,d]=s.slice(0,10).split("-").map(Number);return new Date(y,m-1,d)};
const addDays=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const wd=d=>(d.getDay()+6)%7; // Monday=0
const mkDate=(y,m,d)=>{const x=new Date(y,m-1,d);return x.getMonth()===m-1&&x.getDate()===d?x:null};
function todayDate(){const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate())}

function classify(text){
  const m=text.match(/^\s*(\w+)\s*:/);
  if(m){const d=LEGACY[m[1].toLowerCase()]||m[1].toLowerCase();if(BY_ID[d])return d}
  for(const [d,rx] of AREA_RE) if(rx.test(text))return d;
  return FALLBACK.id;
}
function monthDay(mon,day,year,today){
  const m=MONTHS.indexOf(mon.slice(0,3).toLowerCase())+1, y=year?+year:today.getFullYear();
  let d=mkDate(y,m,+day); if(!d)return null;
  if(!year&&d<today)d=mkDate(y+1,m,+day);
  return d;
}
function parseDate(text,today){
  const t=text.toLowerCase(); let m;
  if(m=t.match(/\b(\d{4})-(\d{2})-(\d{2})\b/)){const d=mkDate(+m[1],+m[2],+m[3]);if(d)return d}
  if(m=t.match(/\b(\d{1,2})\/(\d{1,2})\/(\d{4})\b/)){const d=mkDate(+m[3],+m[2],+m[1]);if(d)return d}
  if(/\b(today|tonight|aaj|aj)\b/.test(t))return today;
  if(/\b(tomorrow|tmrw|tmr|kal)\b/.test(t))return addDays(today,1);
  if(/\b(parso|parson)\b/.test(t))return addDays(today,2);
  if(/\b(next week|agle hafte|agle week)\b/.test(t))return addDays(today,7);
  if(m=t.match(/\b(\d+)\s+din\s+(?:baad|bad|mein|me)\b/))return addDays(today,+m[1]);
  if(m=t.match(/\bin\s+(\d+)\s+(day|week|month|year)s?\b/))return addDays(today,+m[1]*{day:1,week:7,month:30,year:365}[m[2]]);
  if(m=t.match(new RegExp(`\\b(next\\s+)?(${WEEKDAYS.join("|")})\\b`)))return addDays(today,((WEEKDAYS.indexOf(m[2])-wd(today))%7+7)%7||7);
  for(let i=0;i<7;i++) if(new RegExp(`\\b(?:${HI_WEEKDAYS[i]})(?:\\s+ko)?\\b`).test(t))return addDays(today,((i-wd(today))%7+7)%7||7);
  if(m=t.match(new RegExp(`\\b(\\d{1,2})(?:st|nd|rd|th)?\\s+${MON}(?:\\s+(\\d{4}))?\\b`)))return monthDay(m[2],m[1],m[3],today);
  if(m=t.match(new RegExp(`\\b${MON}\\s+(\\d{1,2})(?:st|nd|rd|th)?(?:,?\\s+(\\d{4}))?\\b`)))return monthDay(m[1],m[2],m[3],today);
  return null;
}
function parseTime(text){
  const m=text.match(/\b(?:at\s+)?(\d{1,2})(?::(\d{2}))?\s*(am|pm)\b|\b(\d{1,2}):(\d{2})\b/i); if(!m)return null;
  let h,mi;
  if(m[1]){h=+m[1];mi=+(m[2]||0);if(h>12)return null;h=h%12+(m[3].toLowerCase()==="pm"?12:0)}
  else{h=+m[4];mi=+m[5]}
  return h<24&&mi<60?`${pad(h)}:${pad(mi)}`:null;
}
function parseRepeat(text){
  let m=text.match(/\bevery\s+(?:(\d+|other)\s+)?(day|week|month|year)s?\b/i);
  if(m)return{every:(m[1]||"").toLowerCase()==="other"?2:+(m[1]||1),unit:m[2].toLowerCase()};
  if(m=text.match(/\b(daily|weekly|monthly|yearly|annually)\b/i))return{every:1,unit:{daily:"day",weekly:"week",monthly:"month",yearly:"year",annually:"year"}[m[1].toLowerCase()]};
  if(new RegExp(`\\bevery\\s+(${WEEKDAYS.join("|")})\\b`,"i").test(text))return{every:1,unit:"week"};
  return null;
}
function parseMetrics(text){
  const out=[];
  for(const [m,rx] of METRICS){const hit=text.match(rx);if(!hit)continue;
    let name=m.name; if(m.per_subject)name=(PET_RE.test(text)&&!/\b(my|meri|mera)\b/i.test(text)?"pet.":"me.")+name;
    out.push({name,value:parseFloat(hit[1].replace(/,/g,"")),unit:m.unit})}
  return out;
}
function addInterval(d,every,unit){
  if(unit==="day"||unit==="week")return addDays(d,every*(unit==="week"?7:1));
  const months=every*(unit==="year"?12:1), y=d.getFullYear(), m=d.getMonth()+months;
  const last=new Date(y,m+1,0).getDate();
  return new Date(y,m,Math.min(d.getDate(),last));
}
function parse(text,today){
  let due=parseDate(text,today); const repeat=parseRepeat(text);
  if(repeat&&!due)due=today;
  let dueStr=null; if(due){const tm=parseTime(text);dueStr=iso(due)+(tm?"T"+tm:"")}
  const tracking=[...text.matchAll(/\b(1Z[0-9A-Z]{16}|[A-Z]{2}\d{9}[A-Z]{2}|\d{12,22})\b/g)].map(m=>m[1]);
  let domain=classify(text);
  if(tracking.length&&domain==="journal")domain="shopping";
  const explicit=/^\s*(?:idea|journal)\s*:/i.test(text);
  if(due&&(domain==="journal"||domain==="idea")&&!explicit&&!/\bidea\b/i.test(text))domain="calendar";
  return{text:text.trim(),domain,due:dueStr,tags:[...text.matchAll(/(?<!\w)#(\w+)/g)].map(m=>m[1]),tracking,repeat,metrics:parseMetrics(text)};
}

/* ---------- ask (port of lifeos/ask.py) ---------- */
const STOP=new Set("a an the is are was were be been of to for in on at by my our your me i we it its this that what when where which who how do does did any next last ka ki ke kab hai kya mera meri mere".split(" "));
const SYN={vaccine:["vaccination","shot","jab","rabies"],vet:["doctor"],passport:["visa","document"],rent:["landlord"],package:["parcel","delivery","order"]};
function tokens(text){
  const w=new Set((text.toLowerCase().match(/[a-z0-9]+/g)||[]).filter(x=>!STOP.has(x)).map(x=>x.replace(/s+$/,"")));
  for(const [k,s] of Object.entries(SYN)) if(w.has(k)||s.some(x=>w.has(x))){w.add(k);s.forEach(x=>w.add(x))}
  return w;
}
function answer(q,items,today){
  const qt=tokens(q);
  const scored=items.map(it=>{const tt=tokens(it.text);let hit=0;qt.forEach(x=>{if(tt.has(x))hit++});
    const up=!!it.due&&!it.done&&daysLeft(it,today)>=0;return{hit,up,it}}).filter(s=>s.hit);
  scored.sort((a,b)=>b.hit-a.hit||(b.up-a.up)||String(a.it.due||"9999").localeCompare(String(b.it.due||"9999"))||b.it.id-a.it.id);
  return scored.slice(0,3).map(s=>s.it);
}

/* ---------- storage: private db per person, device storage as fallback ---------- */
let items=new Map(), backend=null, undoStack=[];
const LS_KEY="lifeos.items.v1";
const localBackend={
  label:"Saved on this device only",
  load(){try{const raw=localStorage.getItem(LS_KEY);(raw?JSON.parse(raw):[]).forEach(i=>items.set(i.id,upgrade(i)))}catch(e){}},
  save(){try{localStorage.setItem(LS_KEY,JSON.stringify([...items.values()]))}catch(e){}},
  async put(it){items.set(it.id,it);this.save();render()},
  async del(id){items.delete(id);this.save();render()}
};
async function connect(){
  try{
    const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
    const uid=db&&user?await user.id():null;
    if(!uid)throw new Error("no db");
    const col=db.collection(`data/users/${uid}/items`);
    backend={label:"Private to you · synced across devices",
      async put(it){items.set(it.id,it);render();await col.doc("i"+it.id).set(it)},
      async del(id){items.delete(id);render();await col.doc("i"+id).delete()}};
    col.onSnapshot(snap=>{items=new Map(snap.docs.map(d=>{const x=upgrade(d.data());return[x.id,x]}));render()},
      e=>{note(`Sync paused: ${e.message}`)});
  }catch(e){backend=localBackend;backend.load()}
  note(backend.label);render();
}
function note(t){document.getElementById("storeNote").textContent=t}
const nowStamp=()=>new Date().toISOString().slice(0,19);
const clone=o=>o?JSON.parse(JSON.stringify(o)):null;

async function change(id,next,msg){
  undoStack.push({id,prev:clone(items.get(id))});
  if(next)await backend.put(next);else await backend.del(id);
  toast(msg);
}
async function undo(){
  const u=undoStack.pop(); if(!u)return;
  if(u.prev)await backend.put(u.prev);else await backend.del(u.id);
  toast("Undone",false);
}
async function capture(text){
  const id=Math.max(0,...items.keys())+1;
  const it={id,created:nowStamp(),done:false,...parse(text,todayDate())};
  await change(id,it,`Saved to ${area(it.domain).label}${it.due?` · ${rel(daysLeft(it,todayDate()))}`:""}`);
}
async function complete(id){
  const it=clone(items.get(id)); const today=todayDate();
  if(it.repeat&&it.due){
    const [d,t]=it.due.split("T"); let nx=addInterval(fromIso(d),it.repeat.every,it.repeat.unit);
    while(nx<today)nx=addInterval(nx,it.repeat.every,it.repeat.unit);
    it.due=iso(nx)+(t?"T"+t:""); (it.completions=it.completions||[]).push(nowStamp());
    await change(id,it,`Done · next ${it.due.slice(0,10)}`);
  }else{it.done=true;it.done_at=nowStamp();await change(id,it,"Done")}
}

/* ---------- views ---------- */
const daysLeft=(it,today)=>Math.round((fromIso(it.due)-today)/864e5);
const rel=n=>n===0?"today":n===1?"tomorrow":n>0?`in ${n}d`:`${-n}d overdue`;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const MON_SHORT=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function row(it,today,{del=false}={}){
  let when="";
  if(it.due){const n=daysLeft(it,today),d=fromIso(it.due),cls=it.done?"":n<0?"late":n<=2?"soon":"";
    when=`<div class="when ${cls}"><b>${rel(n)}</b>${d.getDate()} ${MON_SHORT[d.getMonth()]}${d.getFullYear()!==today.getFullYear()?" "+d.getFullYear():""}${it.due.includes("T")?" · "+it.due.slice(11):""}</div>`}
  else when=`<div class="when">${esc((it.created||"").slice(5,10).replace("-","/"))}</div>`;
  const a=area(it.domain), chips=[`<span class="chip">${a.icon} ${esc(a.label)}</span>`];
  if(it.repeat)chips.push(`<span class="chip">every ${it.repeat.every>1?it.repeat.every+" "+it.repeat.unit+"s":it.repeat.unit}</span>`);
  (it.tracking||[]).forEach(t=>chips.push(`<span class="chip">${esc(t)}</span>`));
  (it.metrics||[]).forEach(m=>chips.push(`<span class="chip">${esc(m.name)} ${m.value}${esc(m.unit||"")}</span>`));
  const acts=[];
  if(!it.done)acts.push(`<button class="tick" data-done="${it.id}" aria-label="Mark done: ${esc(it.text)}">✓</button>`);
  if(del)acts.push(`<button class="del" data-del="${it.id}">Delete</button>`);
  return `<div class="row${it.done?" done":""}">${when}<div class="what">${esc(it.text)}<div class="meta">${chips.join("")}</div></div><div class="act">${acts.join("")}</div></div>`;
}
const list=(arr,today,empty,o)=>`<div class="list">${arr.length?arr.map(i=>row(i,today,o)).join(""):`<div class="empty">${empty}</div>`}</div>`;
const EXAMPLES=LIFE.start_examples||AREAS.map(a=>a.examples[0]);
const openDated=arr=>arr.filter(i=>i.due&&!i.done).sort((a,b)=>a.due.localeCompare(b.due));

function vToday(all,today){
  const open=openDated(all);
  const late=open.filter(i=>daysLeft(i,today)<0);
  const up=open.filter(i=>{const n=daysLeft(i,today);return n>=0&&n<=leadDays(i)});
  const notes=all.filter(i=>!i.due&&!i.done).sort((a,b)=>b.id-a.id).slice(0,5);
  if(!all.length)return `<section><h2>Start here</h2><div class="list"><div class="empty">Nothing captured yet. Tap an example to add it, or type your own. Every part of life works: home, money, health, work, family, travel, pets, documents and more.</div><div class="examples">${EXAMPLES.map(e=>`<button class="ex" data-ex="${esc(e)}">${esc(e)}</button>`).join("")}</div></div></section>`;
  return (late.length?`<section><h2>Overdue</h2>${list(late,today)}</section>`:"")+
    `<section><h2>Coming up</h2>${list(up,today,"Nothing due soon. Renewals show up early: passport 6 months, insurance 1 month.")}</section>`+
    `<section><h2>Recent notes</h2>${list(notes,today,"Undated notes and ideas land here.")}</section>`;
}

/* metrics */
function points(arr,since){
  const out={};
  [...arr].sort((a,b)=>a.id-b.id).forEach(i=>{const d=i.created.slice(0,10);if(since&&d<since)return;
    (i.metrics||[]).forEach(m=>(out[m.name]=out[m.name]||[]).push([d,m.value]))});
  return out;
}
function statCard(name,s){
  const u=unitOf(name), vals=s.map(x=>x[1]), label=name.replace("me.","my ").replace("pet.","pet ");
  if(isSum(name))return `<div class="stat"><div class="k">${esc(label)}</div><div class="v">${u}${+vals.reduce((a,b)=>a+b,0).toFixed(2)}</div><div class="s">${vals.length} entries</div></div>`;
  const avg=vals.reduce((a,b)=>a+b,0)/vals.length;
  return `<div class="stat"><div class="k">${esc(label)}</div><div class="v">${vals[vals.length-1]}<small style="font-size:14px"> ${esc(u)}</small></div><div class="s">${vals.slice(-5).join(" → ")} · avg ${+avg.toFixed(1)}</div></div>`;
}
const statGrid=pts=>Object.keys(pts).length?`<div class="stats">${Object.entries(pts).map(([n,s])=>statCard(n,s)).join("")}</div>`:"";

/* life wheel + one area */
let lifeArea=null;
function vLife(all,today){
  if(lifeArea)return vArea(all,lifeArea,today);
  const by={}; all.forEach(i=>{const id=area(i.domain).id;(by[id]=by[id]||[]).push(i)});
  const used=[...AREAS,FALLBACK].filter(a=>by[a.id]), quiet=AREAS.filter(a=>!by[a.id]);
  const card=a=>{const its=by[a.id]||[], open=its.filter(i=>!i.done).length, nx=openDated(its)[0];
    const sub=nx?`Next: ${esc(nx.text)} · ${rel(daysLeft(nx,today))}`:esc(a.covers);
    return `<button class="area-btn" data-area="${a.id}"><span class="ic">${a.icon}</span><span><span class="nm">${esc(a.label)}</span><span class="sub">${sub}</span></span><span class="n">${its.length?open+" open":""}</span></button>`};
  return (used.length?`<section><h2>Your areas</h2><div class="areas">${used.map(card).join("")}</div></section>`:"")+
    (quiet.length?`<section><h2>${used.length?"Not tracking yet":"Every part of life"}</h2><div class="areas">${quiet.map(card).join("")}</div></section>`:"");
}
function vArea(all,id,today){
  const a=area(id), its=all.filter(i=>area(i.domain).id===a.id);
  const sched=openDated(its), notes=its.filter(i=>!i.due&&!i.done).sort((x,y)=>y.id-x.id).slice(0,6);
  const hist=its.filter(i=>i.done||(i.completions||[]).length).sort((x,y)=>y.id-x.id).slice(0,6);
  return `<button class="back" data-area="">← All areas</button><section><h2>${a.icon} ${esc(a.label)}</h2><p class="covers">${esc(a.covers)}</p></section>`+
    statGrid(points(its))+
    `<section><h2>Scheduled</h2>${list(sched,today,"Nothing scheduled.")}</section>`+
    `<section><h2>Notes</h2>${list(notes,today,"No notes yet.")}</section>`+
    `<section><h2>Done</h2>${list(hist,today,"Nothing completed yet.")}</section>`+
    `<section><h2>Try typing</h2><div class="examples" style="padding:0">${(a.examples||[]).map(e=>`<button class="ex" data-fill="${esc(e)}">${esc(e)}</button>`).join("")}</div><div class="tipline">${esc(a.tip)}</div></section>`;
}

const PROMPTS=["What gave you energy this week, and what drained it?","One thing you're proud of, one thing you'd redo?","Which part of your life got no attention this week?","What are you avoiding? What's the smallest next step?","Who do you want to spend more time with next week?","What would make next week feel like a win?"];
function vReview(all,today){
  const start=iso(addDays(today,-6)), end=iso(addDays(today,7));
  const week=all.filter(i=>i.created.slice(0,10)>=start);
  const doneN=all.filter(i=>(i.done_at||"").slice(0,10)>=start).length+all.reduce((n,i)=>n+(i.completions||[]).filter(c=>c.slice(0,10)>=start).length,0);
  const ideas=week.filter(i=>i.domain==="idea");
  const next=openDated(all).filter(i=>i.due.slice(0,10)>=iso(today)&&i.due.slice(0,10)<=end);
  const wk=Math.floor((today-new Date(today.getFullYear(),0,1))/6048e5);
  const touched=new Set(week.map(i=>area(i.domain).id));
  const quiet=[...new Set(all.map(i=>area(i.domain).id))].filter(id=>!touched.has(id)).map(id=>area(id));
  return `<div class="stats"><div class="stat"><div class="k">Captured</div><div class="v">${week.length}</div><div class="s">since ${start.slice(5)}</div></div><div class="stat"><div class="k">Completed</div><div class="v">${doneN}</div><div class="s">incl. repeats</div></div></div>`+
    statGrid(points(all,start))+
    (quiet.length?`<section><h2>Quiet this week</h2><div class="tipline">${quiet.map(a=>a.icon+" "+esc(a.label)).join(" · ")}</div></section>`:"")+
    `<section><h2>Journal prompt</h2><div class="prompt">${PROMPTS[wk%PROMPTS.length]}</div><p class="hint" style="margin:0">Answer in the box with <code>journal: …</code></p></section>`+
    `<section><h2>Ideas this week</h2>${list(ideas,today,"No ideas yet. Prefix with idea:")}</section>`+
    `<section><h2>Next 7 days</h2>${list(next,today,"Nothing scheduled.")}</section>`;
}
let filter="", showDone=false;
function vAll(all,today){
  const doms=[...new Set(all.map(i=>area(i.domain).id))].sort();
  const rows=all.filter(i=>(showDone||!i.done)&&(!filter||area(i.domain).id===filter)).sort((a,b)=>b.id-a.id);
  return `<div class="filters"><button data-f="" aria-pressed="${!filter}">All</button>${doms.map(d=>`<button data-f="${d}" aria-pressed="${filter===d}">${area(d).icon} ${esc(area(d).label)}</button>`).join("")}<button data-showdone aria-pressed="${showDone}">Show done</button></div>`+
    list(rows,today,"Nothing here.",{del:true});
}

let view="today";
try{view=localStorage.getItem("lifeos.view")||"today";if(view==="dog")view="life"}catch(e){}
function render(){
  const all=[...items.values()], today=todayDate();
  document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected",t.dataset.v===view));
  document.getElementById("view").innerHTML=({today:vToday,life:vLife,review:vReview,all:vAll}[view]||vToday)(all,today);
}
let toastTimer;
function toast(msg,canUndo=true){
  const el=document.getElementById("toast");document.getElementById("toastMsg").textContent=msg;
  document.getElementById("toastUndo").hidden=!canUndo;el.hidden=false;
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.hidden=true,5000);
}
function showAnswer(q){
  const today=todayDate(), best=answer(q,[...items.values()],today), box=document.getElementById("answer");
  if(!best.length)box.innerHTML=`<div class="answer"><span class="label">Answer</span><div class="main">Nothing in your journal matches that yet.</div></div>`;
  else{const t=best[0];box.innerHTML=`<div class="answer"><span class="label">Answer</span><div class="main">${esc(t.text)}${t.due?` · ${rel(daysLeft(t,today))}`:""}</div>${t.due?`<div class="when">${esc(t.due.replace("T"," "))}</div>`:""}</div>`+(best.length>1?`<section><h2>Related</h2>${list(best.slice(1),today)}</section>`:"")}
  box.hidden=false;
}

document.getElementById("cap").addEventListener("submit",async e=>{
  e.preventDefault(); const inp=document.getElementById("q"), text=inp.value.trim(); if(!text||!backend)return;
  inp.value="";
  if(text.endsWith("?")&&!/^\w+\s*:/.test(text))showAnswer(text);
  else{document.getElementById("answer").hidden=true;await capture(text)}
});
document.addEventListener("click",async e=>{
  const b=e.target.closest("button"); if(!b)return;
  if(b.dataset.v){view=b.dataset.v;lifeArea=null;try{localStorage.setItem("lifeos.view",view)}catch(_){}render();return}
  if(b.dataset.area!==undefined){lifeArea=b.dataset.area||null;render();window.scrollTo(0,0);return}
  if(b.dataset.fill){const q=document.getElementById("q");q.value=b.dataset.fill;q.focus();return}
  if(!backend)return;
  if(false){}
  else if(b.dataset.done)await complete(+b.dataset.done);
  else if(b.dataset.del)await change(+b.dataset.del,null,"Deleted");
  else if(b.dataset.ex)await capture(b.dataset.ex);
  else if(b.dataset.f!==undefined){filter=b.dataset.f;render()}
  else if(b.hasAttribute("data-showdone")){showDone=!showDone;render()}
  else if(b.id==="toastUndo"){document.getElementById("toast").hidden=true;await undo()}
});
render();
if(window.claude&&claude.use)connect();else{backend=localBackend;backend.load();note(backend.label);render()}
</script>
